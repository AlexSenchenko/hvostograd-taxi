<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Хвостоград Такси 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --sky:#CFE3EC;
  --paper:#FFFFFF;
  --paper-2:#F2F5F3;
  --line:#D3DCD8;
  --ink:#1D2A2B;
  --muted:#6B7F80;
  --amber:#EE9B2E;
  --amber-hot:#FFB65A;
  --amber-deep:#C97A16;
  --leaf:#4E9B5F;
  --coral:#E0574B;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Manrope","Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}

#stage{position:fixed;inset:0;background:var(--sky)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:absolute;inset:0;pointer-events:none;padding:14px;display:grid;
  grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:12px;
  grid-template-areas:"driver order purse" ". . ." "meter touch map";}
.hud > *{pointer-events:auto}

.plate{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 18px rgba(31,54,54,.14);backdrop-filter:blur(4px)}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}

#driverChip{grid-area:driver;display:flex;align-items:center;gap:10px;padding:7px 15px 7px 7px;border-radius:999px;
  background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 6px 18px rgba(31,54,54,.14)}
#driverChip svg{width:54px;height:54px;flex:none}
#driverChip .nm{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.1}
#driverChip .pk{font-size:11px;color:var(--amber-deep);font-weight:700}

#orderCard{grid-area:order;justify-self:center;min-width:min(420px,90vw);max-width:520px;padding:10px 14px 12px}
#orderCard .goal{font-family:var(--display);font-weight:600;font-size:15px;text-wrap:balance}
#orderCard .addr{font-size:13px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:12px}
#orderCard .addr b{color:var(--ink);font-weight:800}
#orderCard .dist{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--amber-deep)}
.bar{height:5px;border-radius:3px;background:#E3EAE6;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--amber));transition:width .2s linear}
.bar.low i{background:linear-gradient(90deg,var(--coral),#EE9B2E)}

#heatChip{position:absolute;left:50%;top:86px;transform:translateX(-50%);z-index:3;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.94);border:1px solid #C3D2DE;box-shadow:0 6px 18px rgba(31,54,54,.16)}
#heatChip[hidden]{display:none}
#heatChip .siren{width:11px;height:11px;border-radius:50%;background:#2F6FD0;animation:siren 1s steps(1) infinite}
#heatChip .txt{font-size:12px;font-weight:800}
#heatChip .hbar{width:96px;height:5px;border-radius:3px;background:#E3EAE6;overflow:hidden}
#heatChip .hbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2F6FD0,#D24437);transition:width .25s linear}
@keyframes siren{0%{background:#2F6FD0}50%{background:#D24437}100%{background:#2F6FD0}}

#purse{grid-area:purse;justify-self:end;padding:9px 14px;text-align:right;min-width:158px}
#purse .money{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--amber-deep);line-height:1.1}
#purse .row{display:flex;gap:14px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#purse .row b{color:var(--ink);font-weight:800}
#nextUp{margin-top:8px}
#nextUp .label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}

#meter{grid-area:meter;align-self:end;padding:10px 14px;display:flex;gap:18px;align-items:flex-end}
#meter .v{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#meter .fare .v{font-size:24px;color:var(--amber-deep)}
#meter .spd .v{font-size:18px}
#meter .clk .v{font-size:18px;color:var(--muted)}
#meter .tariff{font-size:10px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;max-width:130px;line-height:1.6}

#mapWrap{grid-area:map;align-self:end;justify-self:end;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{width:132px;height:104px;border-radius:8px;display:block;background:#CBD5CE}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
.btn:hover{border-color:var(--amber);color:var(--amber-deep)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);color:#241505;border-color:var(--amber-deep)}
.btn.primary:hover{background:var(--amber-hot);color:#241505}
.btn[disabled]{opacity:.42;cursor:not-allowed;border-color:var(--line);color:var(--muted)}

#touch{display:none}
#touch .pad{width:72px;height:72px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:24px;font-weight:800;user-select:none;touch-action:none;
  box-shadow:0 4px 12px rgba(31,54,54,.18)}
#touch .pad.gas{background:var(--amber);border-color:var(--amber-deep);color:#241505}
#touch .pad.fire{position:absolute;left:calc(50% - 32px);bottom:0;width:64px;height:64px;border-radius:50%;pointer-events:auto;
  background:#4BA3E0;border-color:#2F7FB8;font-size:28px}
#touch .pad.fire.act{background:#7CC0F0}
@media (pointer:coarse) and (max-width:430px){
  #touch .pad{width:64px;height:64px}
  #touch .grp{gap:10px}
}
@media (pointer:coarse) and (max-width:370px){
  #touch .pad{width:58px;height:58px}
  #touch .pad.fire{width:56px;height:56px;left:calc(50% - 28px)}
}
#touch .pad.act{background:#FFB65A;color:#241505;transform:scale(.96)}
@media (pointer:coarse){
  #touch{display:flex;position:absolute;left:0;right:0;bottom:12px;z-index:6;
    justify-content:space-between;padding:0 12px;pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  .hud{padding-bottom:100px}
}

#veil{position:absolute;inset:0;background:rgba(29,52,52,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:5}
#veil[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(20,40,40,.28)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;margin:6px 0 18px;line-height:1.6}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}

.upg{display:flex;flex-direction:column;gap:8px}
.upg .it{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
  padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)}
.upg .nm{font-weight:800;font-size:14px}
.upg .ef{font-size:11px;color:var(--muted);grid-column:1}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:16px;height:5px;border-radius:2px;background:#E3EAE6;border:1px solid var(--line)}
.pips i.on{background:var(--amber);border-color:var(--amber-deep)}

.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.crew .c{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper-2);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.crew .c.on{border-color:var(--amber);background:#FFF3E0}
.crew .c.lock{opacity:.5}
.crew svg{width:56px;height:56px}
.crew .nm{font-family:var(--display);font-weight:600;font-size:13px}
.crew .pk{font-size:11px;color:var(--amber-deep);line-height:1.45;font-weight:600}
.crew .lk{font-size:11px;color:var(--muted)}
.crew button{margin-top:auto;width:100%;padding:6px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:12px;font-weight:700}

.tally{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tally .tr{display:flex;justify-content:space-between;gap:14px;padding:9px 13px;background:var(--paper-2);font-size:13px}
.tally .tr b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.tally .tr.hi{background:#FFF3E0}
.tally .tr.hi b{color:var(--amber-deep)}

.hero{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.hero svg{width:88px;height:88px;flex:none}

#toast{position:absolute;left:50%;top:98px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:var(--paper);border:1px solid var(--amber);border-radius:12px;padding:9px 16px;font-size:13px;
  font-weight:800;color:var(--amber-deep);animation:pop .3s ease-out;white-space:nowrap;box-shadow:0 8px 22px rgba(31,54,54,.18)}
.tst small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;font-family:var(--mono)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.keys{font-size:12px;color:var(--muted);line-height:1.9}
.keys kbd{font-family:var(--mono);font-size:11px;background:var(--paper-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink)}

@media (max-width:720px){
  .hud{padding:9px;gap:8px;grid-template-areas:"driver order order" "purse . ." "meter touch map"}
  #orderCard{min-width:0;width:100%;padding:8px 11px 10px}
  #orderCard .goal{font-size:13px}
  #purse{justify-self:start;text-align:left;min-width:0;padding:7px 11px}
  #purse .row{justify-content:flex-start}
  #driverChip .pk{display:none}
  #mini{width:96px;height:76px}
  #meter .tariff{display:none}
  #meter .clk{display:none}
}
.hud{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));
  padding-right:calc(14px + env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#svcChip{position:absolute;left:50%;top:calc(132px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.95);border:2px solid var(--svc,#E4574B);box-shadow:0 6px 18px rgba(31,54,54,.16)}
#svcChip .txt{font-size:13px;font-weight:800}
#svcChip .hbar{width:110px;height:7px;border-radius:4px;background:#E3EAE6;overflow:hidden}
#svcChip .hbar i{display:block;height:100%;width:0%;background:var(--svc,#E4574B);transition:width .15s linear}
#purse .gold b{color:var(--amber-deep)}
.gauges{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:14px;min-width:96px}
.gauge .label{display:block;margin-bottom:2px}
.gauge .bar{display:block;margin-top:0;height:7px}
.gauge.warn .bar i{background:linear-gradient(90deg,var(--coral),#EE9B2E)}
.gauge.warn .label{color:var(--coral)}
#fuelBar{background:linear-gradient(90deg,#E4574B,#F2A93C 30%,var(--leaf))}
#cleanBar{background:linear-gradient(90deg,#9C8058,#7EC8E3)}
.badge{display:inline-block;min-width:26px;padding:1px 5px;border-radius:999px;background:var(--amber);color:#241505;font-size:10px;font-family:var(--mono);margin-left:2px}
.badge.done{background:var(--leaf);color:#fff}
#starPop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center}
#starPop .st{font-size:64px;letter-spacing:6px;line-height:1;color:#F2B63C;
  text-shadow:0 3px 0 #C97A16,0 8px 22px rgba(31,54,54,.35);animation:starIn .5s cubic-bezier(.2,1.6,.4,1)}
#starPop .st i{font-style:normal;color:rgba(255,255,255,.75);text-shadow:0 3px 0 #9FB0AE}
#starPop .why{display:inline-block;margin-top:8px;background:var(--paper);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;color:var(--muted)}
@keyframes starIn{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.tst.sticker{display:flex;align-items:center;gap:10px;border-width:2px;text-align:left}
.tst.sticker svg{width:40px;height:40px;flex:none}
.tst.good{border-color:var(--leaf);color:#2E7A45}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.mode{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper-2);text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--display);font-weight:600;font-size:14px}
.mode span{font-size:12px;color:var(--muted);line-height:1.45}
.mode.on{border-color:var(--amber);background:#FFF3E0}
.mode:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.album .s{border:2px dashed var(--line);border-radius:14px;padding:8px 6px;text-align:center;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;gap:4px}
.album .s.on{border-style:solid;border-color:var(--amber);background:#FFF8EC}
.album .s svg{width:60px;height:60px}
.album .s.off svg{filter:grayscale(1) brightness(1.35);opacity:.45}
.album .s b{font-size:12px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)}
.task .nm{font-weight:800;font-size:14px}
.task .rw{font-family:var(--mono);font-weight:700;color:var(--amber-deep);font-size:13px}
.task .bar{grid-column:1 / -1;margin-top:0;height:7px}
.task.done{background:#EAF5EC;border-color:#A9D3B2}
.task.done .rw{color:#2E7A45}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700}
.sw i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.15)}
.sw.on{border-color:var(--ink)}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu .btn{padding:11px;font-size:13px;text-align:left}
.danger{color:var(--coral)!important;border-color:#F0B7B1!important}
#netBar{display:flex;flex-direction:column;gap:6px;width:100%}
#netBar .nc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:5px 10px}
#netBar .nc b{font-family:var(--mono);font-size:14px;color:var(--amber-deep)}
#netBar .nc span{font-size:11px;color:var(--muted);font-weight:600}
#netBar .reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#netBar .reacts .btn{padding:5px 0;font-size:18px;line-height:1.2}
.netgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.netbox{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.netbox p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
#netHint{color:var(--coral);font-weight:700}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%}
.words .btn{padding:7px 0;font-size:11px}
.words .btn.on{background:var(--amber);border-color:var(--amber-deep);color:#241505}
.netjoin{display:flex;gap:8px;width:100%}
#netNum{font:700 20px var(--mono);width:4.4em;padding:5px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center}
.neterr{background:#FDEDEB;border:1.5px solid #F0B7B1;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;word-break:break-word}
.netcode{font:800 40px var(--mono);letter-spacing:.06em;text-align:center;color:var(--amber-deep);margin:4px 0 12px}
.netlink{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.netlink code{font:12px var(--mono);background:var(--paper-2);padding:6px 8px;border-radius:8px;word-break:break-all;flex:1;min-width:0}
@media (max-width:560px){.netgrid{grid-template-columns:1fr}}
@media (max-width:720px){
  .hud{padding-top:calc(9px + env(safe-area-inset-top,0px));padding-left:calc(9px + env(safe-area-inset-left,0px));
    padding-right:calc(9px + env(safe-area-inset-right,0px));padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
  .gauges{min-width:72px;padding-left:10px}
  #starPop .st{font-size:48px}
  .swatches{grid-template-columns:repeat(5,1fr);gap:6px}
  .sw i{width:30px;height:30px}
  .hud{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto;
    grid-template-areas:"order order" "driver purse" ". ." "meter map"}
  #orderCard{justify-self:stretch;max-width:none}
  #driverChip{align-self:start;justify-self:start;padding:4px 12px 4px 4px;gap:7px;max-width:100%}
  #driverChip svg{width:36px;height:36px}
  #driverChip .nm{font-size:12px}
  #purse{align-self:start;justify-self:end;text-align:right}
  #purse .row{justify-content:flex-end;gap:10px}
  #purse .money{font-size:18px}
  #nextUp{display:none}
  #meter{gap:12px;padding:8px 11px;min-width:0}
  #meter .fare .v{font-size:20px}
  #meter .spd{display:none}
  #mapWrap{padding:6px;gap:6px;width:min(176px,46vw)}
  #mini{width:100%;height:auto;aspect-ratio:132/104}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
  .btns .btn{padding:6px 4px;font-size:11px;text-align:center}
  #toast{top:calc(150px + env(safe-area-inset-top,0px));width:calc(100% - 24px)}
  .tst{white-space:normal;max-width:100%}
  #svcChip{top:auto;bottom:calc(250px + env(safe-area-inset-bottom,0px))}
  #starPop{top:46%}
}
@media (pointer:coarse){
  #touch{bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
  .hud{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div id="driverChip"><span id="chipAv"></span><span><span class="nm" id="chipName">Мартын</span><br><span class="pk" id="chipPerk"></span></span></div>

    <div id="orderCard" class="plate">
      <div class="goal" id="goalText">Смена не начата</div>
      <div class="addr"><span id="addrText">Хвостоград, парк такси</span><span class="dist" id="distText">—</span></div>
      <div class="bar" id="patBar"><i style="width:100%"></i></div>
    </div>

    <div id="heatChip" hidden><span class="siren"></span><span class="txt" id="heatText">Патруль на хвосте</span><span class="hbar"><i id="heatBar"></i></span></div>

    <div id="svcChip" hidden><span class="txt" id="svcText">Заправка</span><span class="hbar"><i id="svcBar"></i></span></div>

    <div id="purse" class="plate">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ---------- Хвостоград: мир ---------- */
const ROAD = 72, BLOCK = 200, CELL = ROAD + BLOCK, GW = 10, GH = 8;
const WW = GW * CELL + ROAD, WH = GH * CELL + ROAD;
const M_PER_PX = 0.25;
const BOARD = 20, PER_M = 0.24;
const CURB = 2.6;                                   // высота тротуара

const STREET_V = ["пр. Копытный","ул. Клыковая","ул. Пуховая","бул. Усатый","ул. Чешуйчатая","пер. Гнёздный","ул. Рогатая","пр. Плавниковый","ул. Ушастая","ул. Мшистая","ш. Косматое"];
const STREET_H = ["наб. Норная","ул. Хвостатая","пер. Лапчатый","бул. Гривистый","ул. Когтевая","ш. Берложье","ул. Крылатая","пер. Копошный","ул. Полосатая"];

const CREW = [
  {id:"monkey", name:"Мартын", kind:"обезьяна", at:0,  fur:"#8A6246", fur2:"#E0B189", ear:"round", nose:"#3B2A20",
   perk:"Цепкие лапы: +15% к управлению", mod:{turn:1.15}},
  {id:"racoon", name:"Гоша", kind:"енот", at:10, fur:"#8B98A1", fur2:"#E6ECEF", ear:"point", nose:"#2A3238", mask:true,
   perk:"Обаятельный жулик: +35% чаевых", mod:{tips:1.35}},
  {id:"cheetah",name:"Спринт", kind:"гепард", at:20, fur:"#E0AE4C", fur2:"#F6E7BE", ear:"round", nose:"#3B2A20", spots:true,
   perk:"Разгон саванны: +20% скорости", mod:{speed:1.2}},
  {id:"owl",    name:"Уля", kind:"сова", at:30, fur:"#B08C63", fur2:"#EFDDC2", ear:"tuft", nose:"#E8A33D",
   perk:"Зоркий глаз: пассажиры ждут на 40% дольше", mod:{patience:1.4}},
  {id:"fox",    name:"Рыж", kind:"лис", at:40, fur:"#DD7A32", fur2:"#F8ECE0", ear:"point", nose:"#2A2220",
   perk:"Свой тариф: +20% к оплате", mod:{fare:1.2}},
  {id:"turtle", name:"Тиша", kind:"черепаха", at:50, fur:"#6A9862", fur2:"#D3E2B4", ear:"tiny", nose:"#2F3B2C", shell:true,
   perk:"Панцирь: удары не сбрасывают скорость и рейтинг", mod:{armor:1}}
];

const UPGRADES = [
  {id:"motor", name:"Мотор", ef:l=>`макс. скорость +${l*8}%`, base:90},
  {id:"boost", name:"Разгон", ef:l=>`ускорение +${l*12}%`, base:80},
  {id:"tyres", name:"Резина", ef:l=>`поворотливость +${l*10}%`, base:75},
  {id:"meterUp", name:"Счётчик", ef:l=>`тариф +${l*10}%`, base:120},
  {id:"charm", name:"Обаяние", ef:l=>`чаевые +${l*20}%`, base:100}
];
const MAXLVL = 6;
const cost = (u,l)=> Math.round(u.base * Math.pow(1.75,l) / 5) * 5;

/* краски для такси: первая — фирменный янтарь */
const PAINTS = [
  {name:"Янтарь", c:"#F2A93C"}, {name:"Малина", c:"#E4476B"}, {name:"Лайм", c:"#8BCB3C"}, {name:"Небо", c:"#4BA3E0"},
  {name:"Сирень", c:"#A36BD6"}, {name:"Мята", c:"#3CC6A8"}, {name:"Апельсин", c:"#F57C2B"}, {name:"Лимон", c:"#F2D43C"},
  {name:"Фламинго", c:"#F29BC4"}, {name:"Графит", c:"#4A5560"}
];
const PAINT_COST = 50;

const S = {
  money:0, orders:0, rating:5, driver:0, unlocked:1,
  up:{motor:0,boost:0,tyres:0,meterUp:0,charm:0},
  started:false, paused:true, order:null, lastBump:-9,
  fails:0, shiftMoney:0, shiftOrders:0, shiftFails:0,
  record:{money:0, orders:0}, muted:false,
  mode:"calm", quality:"auto", color:0, fuel:1, dirt:0, stars:0, album:{}, daily:null
};
const SAVE = "hvostograd-taxi-3d-v1";
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify({money:S.money,orders:S.orders,rating:S.rating,driver:S.driver,
  unlocked:S.unlocked,up:S.up,fails:S.fails,record:S.record,muted:S.muted,
  mode:S.mode,quality:S.quality,color:S.color,fuel:S.fuel,dirt:S.dirt,stars:S.stars,album:S.album,daily:S.daily})); }catch(e){} }
const num = (v, lo, hi, def)=> (typeof v === "number" && isFinite(v)) ? Math.max(lo, Math.min(hi, v)) : def;
function load(){ try{ const r=localStorage.getItem(SAVE); if(!r) return; const d=JSON.parse(r);
  if(d && typeof d.money==="number"){ S.money=num(d.money,0,1e9,0); S.orders=num(d.orders,0,1e7,0)|0; S.rating=num(d.rating,1,5,5);
    S.unlocked=Math.max(1,Math.min(d.unlocked|0||1,CREW.length));
    S.driver=Math.max(0,Math.min(d.driver|0,S.unlocked-1));
    if(d.up && typeof d.up === "object") for(const k in S.up) S.up[k] = num(d.up[k],0,MAXLVL,0)|0;
    S.fails=num(d.fails,0,1e7,0)|0; S.muted=!!d.muted;
    if(d.record && typeof d.record.money==="number") S.record={money:d.record.money|0, orders:d.record.orders|0};
    S.mode = d.mode === "patrol" ? "patrol" : "calm";
    S.quality = ["auto","0","1","2"].includes(d.quality) ? d.quality : "auto";
    S.color = num(d.color,0,PAINTS.length-1,0)|0;
    S.fuel = num(d.fuel,0,1,1); S.dirt = num(d.dirt,0,1,0);
    S.stars = num(d.stars,0,1e7,0)|0;
    if(d.album && typeof d.album === "object") for(const k in d.album) if(d.album[k]) S.album[k] = true;
    if(d.daily && typeof d.daily === "object" && typeof d.daily.date === "string" && Array.isArray(d.daily.list)) S.daily = d.daily; } }catch(e){} }
load();
const calm = ()=> S.mode === "calm";

/* ---------- генерация города ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20260904);
const R = (a,b)=> a + rnd()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+1));

const FACADE = ["#F6C28B","#9FD0EE","#F5A9A0","#BFE08F","#F8DD7A","#CDB1EC","#F9CFA6","#A6DCCB","#F3EBDD"];
const ROOFC  = ["#E0603F","#D9493A","#3F8FC9","#7B5EA7","#E88A2E","#2E9E7A","#C9503D"];
const blocks = [];
for(let gy=0; gy<GH; gy++){
  blocks[gy] = [];
  for(let gx=0; gx<GW; gx++){
    const ox = gx*CELL + ROAD, oy = gy*CELL + ROAD;
    const park = rnd() < 0.15;
    const b = {ox, oy, park, buildings:[], trees:[]};
    if(park){
      for(let i=0;i<RI(8,13);i++) b.trees.push({x:ox+R(16,BLOCK-16), y:oy+R(16,BLOCK-16), r:R(9,15), h:R(26,46)});
    } else {
      const cols = RI(2,3), rows = RI(2,3), cw = BLOCK/cols, ch = BLOCK/rows;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(rnd()<0.12) continue;
        const m1=R(5,12), m2=R(5,12);
        const bx=ox+c*cw+m1, by=oy+r*ch+m1, bw=cw-m1-m2, bh=ch-m1-m2;
        if(bw<26||bh<26) continue;
        b.buildings.push({x:bx, y:by, w:bw, h:bh, ht:R(34,120),
          face:FACADE[RI(0,FACADE.length-1)], roof:ROOFC[RI(0,ROOFC.length-1)]});
      }
      if(rnd()<0.35) b.trees.push({x:ox+R(20,BLOCK-20), y:oy+R(20,BLOCK-20), r:R(8,12), h:R(24,34)});
    }
    blocks[gy][gx] = b;
  }
}

/* станции: заправки, мойка, покраска — на месте фасадов вдоль верхней улицы квартала */
const STATIONS = [
  {kind:"fuel",  gx:2, gy:2, name:"Заправка", sign:"ЗАПРАВКА", col:"#E4574B", letter:"З"},
  {kind:"wash",  gx:6, gy:2, name:"Мойка",    sign:"МОЙКА",    col:"#3C8FD8", letter:"М"},
  {kind:"paint", gx:3, gy:5, name:"Покраска", sign:"ПОКРАСКА", col:"#A36BD6", letter:"П"},
  {kind:"fuel",  gx:7, gy:5, name:"Заправка", sign:"ЗАПРАВКА", col:"#E4574B", letter:"З"}
];
for(const st of STATIONS){
  const b = blocks[st.gy][st.gx];
  b.park = false; b.station = st;
  b.buildings = b.buildings.filter(bd => bd.y > b.oy + 110);
  b.trees = b.trees.filter(t => t.y > b.oy + 120);
  b.buildings.push({x:b.ox+34, y:b.oy+44, w:BLOCK-68, h:56, ht:30, face:"#F4EEE2", roof:st.col, station:true});
  st.x = b.ox + BLOCK/2; st.y = b.oy - 18;            // площадка у бордюра верхней улицы
}

/* окна: маленькие коробочки, чуть выступающие из фасада — зажигаются ночью */
const WINDOWS = [];
for(let gy=0; gy<GH; gy++) for(let gx=0; gx<GW; gx++) for(const bd of blocks[gy][gx].buildings){
  const rows = Math.max(1, Math.floor((bd.ht - 14)/13));
  for(let k=0; k<10; k++){
    if(rnd() < 0.42) continue;
    const yy = CURB + 11 + Math.floor(rnd()*rows)*13;
    if(yy > CURB + bd.ht - 7) continue;
    const face = RI(0,3);
    if(face === 0) WINDOWS.push({sx:0.8, sy:4.4, sz:5.2, x:bd.x+bd.w+0.3, y:yy, z:bd.y + R(7, bd.h-7)});
    else if(face === 1) WINDOWS.push({sx:0.8, sy:4.4, sz:5.2, x:bd.x-0.3, y:yy, z:bd.y + R(7, bd.h-7)});
    else if(face === 2) WINDOWS.push({sx:5.2, sy:4.4, sz:0.8, x:bd.x + R(7, bd.w-7), y:yy, z:bd.y+bd.h+0.3});
    else WINDOWS.push({sx:5.2, sy:4.4, sz:0.8, x:bd.x + R(7, bd.w-7), y:yy, z:bd.y-0.3});
  }
}

const pitched = bd => !bd.station && bd.ht < 75;
function blockAt(x,y){
  const gx = Math.floor(x/CELL), gy = Math.floor(y/CELL);
  if(gx<0||gy<0||gx>=GW||gy>=GH) return null;
  if(x - gx*CELL - ROAD < 0 || y - gy*CELL - ROAD < 0) return null;
  return blocks[gy][gx];
}
function camBlocked(x,y){
  if(x<0||y<0||x>WW||y>WH) return true;
  const gx = Math.floor(x/CELL), gy = Math.floor(y/CELL);
  const lx = x - gx*CELL - ROAD, ly = y - gy*CELL - ROAD;
  return gx<GW && gy<GH && lx > 10 && ly > 10 && lx < BLOCK - 10 && ly < BLOCK - 10;
}
function solid(x,y){
  if(x<8||y<8||x>WW-8||y>WH-8) return true;
  const b = blockAt(x,y);
  if(!b || b.park) return false;
  for(const bd of b.buildings) if(x>bd.x&&x<bd.x+bd.w&&y>bd.y&&y<bd.y+bd.h) return true;
  return false;
}

/* ---------- машина ---------- */
const car = {x: ROAD/2, y: CELL + ROAD/2, a: 0, sp: 0, roll: 0};
function stats(){
  const d = CREW[S.driver].mod, u = S.up;
  return {
    max:   118 * (1 + u.motor*0.08) * (d.speed||1),
    acc:    95 * (1 + u.boost*0.12) * (d.speed||1),
    turn:  2.5 * (1 + u.tyres*0.10) * (d.turn||1),
    fare:  (1 + u.meterUp*0.10) * (d.fare||1),
    tips:  (1 + u.charm*0.20) * (d.tips||1),
    patience: (d.patience||1),
    armor: !!d.armor
  };
}

/* ---------- трафик, светофоры, патруль ---------- */
const traffic = [], cops = [];
const CIV = [["#5B8DBE","#3C6690"],["#7FA05F","#5C7A44"],["#DCD6C8","#B3AC9C"],["#A6604F","#7C4638"],["#5C6771","#3F4850"],["#C9A227","#997A18"],["#8E7BA6","#6A5A80"]];
const LIGHT_T = 9;
let clock = 0, heat = 0, lastViol = -9, lastHit = -9, lastCross = "", stuckT = 0;
const greenAxis = ()=> Math.floor(clock/LIGHT_T) % 2 === 0 ? "v" : "h";
const amberNow  = ()=> (clock % LIGHT_T) > LIGHT_T - 1.6;

const roadX = i => i*CELL + ROAD/2, roadY = j => j*CELL + ROAD/2;
const nearI = x => Math.max(0, Math.min(GW, Math.round((x - ROAD/2)/CELL)));
const nearJ = y => Math.max(0, Math.min(GH, Math.round((y - ROAD/2)/CELL)));

const MAX_TRAFFIC = 22;
function spawnTraffic(){
  const vert = Math.random() < 0.5;
  let x, y, dx, dy;
  if(vert){
    const i = nearI(car.x + (Math.random()-0.5)*820);
    dx = 0; dy = Math.random() < 0.5 ? 1 : -1;
    x = roadX(i); y = car.y - dy*(520 + Math.random()*300);
  } else {
    const j = nearJ(car.y + (Math.random()-0.5)*820);
    dy = 0; dx = Math.random() < 0.5 ? 1 : -1;
    y = roadY(j); x = car.x - dx*(520 + Math.random()*300);
  }
  x += -dy*17; y += dx*17;
  if(x < 24 || y < 24 || x > WW-24 || y > WH-24) return;
  for(const t of traffic) if(Math.abs(t.x-x) < 46 && Math.abs(t.y-y) < 46) return;
  const col = CIV[Math.floor(Math.random()*CIV.length)];
  traffic.push({x, y, dx, dy, sp:0, tsp:40 + Math.random()*30, col, mesh:takeCarMesh(col)});
}
function stopLine(v){
  if(v.dx){ const k = v.dx>0 ? Math.ceil((v.x-ROAD/2)/CELL) : Math.floor((v.x-ROAD/2)/CELL);
            return (k*CELL + ROAD/2 - v.x)*v.dx - ROAD/2; }
  const k = v.dy>0 ? Math.ceil((v.y-ROAD/2)/CELL) : Math.floor((v.y-ROAD/2)/CELL);
  return (k*CELL + ROAD/2 - v.y)*v.dy - ROAD/2;
}
function gapAhead(v, x, y, reach){
  const rel = (x-v.x)*v.dx + (y-v.y)*v.dy, side = Math.abs((x-v.x)*v.dy - (y-v.y)*v.dx);
  return (rel > 0 && rel < reach && side < 15) ? rel : Infinity;
}
function updateTraffic(dt){
  let tries = 0;
  while(traffic.length < MAX_TRAFFIC && tries++ < 5) spawnTraffic();
  const g = greenAxis();
  for(let i=traffic.length-1; i>=0; i--){
    const v = traffic[i];
    if(Math.hypot(v.x-car.x, v.y-car.y) > 1150 || v.x<12 || v.y<12 || v.x>WW-12 || v.y>WH-12){
      freeCarMesh(v.mesh); traffic.splice(i,1); continue;
    }
    let want = v.tsp, gap = Infinity;
    for(const o of traffic){ if(o !== v && o.dx === v.dx && o.dy === v.dy) gap = Math.min(gap, gapAhead(v, o.x, o.y, 66)); }
    gap = Math.min(gap, gapAhead(v, car.x, car.y, 62));
    for(const c of cops) gap = Math.min(gap, gapAhead(v, c.x, c.y, 62));
    if(gap < Infinity) want = Math.min(want, Math.max(0, (gap-27)*1.7));
    if((v.dx ? "h" : "v") !== g && !amberNow()){
      const d = stopLine(v);
      if(d > 0 && d < 48) want = Math.min(want, Math.max(0, (d-9)*1.5));
    }
    v.sp += (want - v.sp) * Math.min(1, dt*2.8);
    v.x += v.dx*v.sp*dt; v.y += v.dy*v.sp*dt;
  }
}
function spawnCop(){
  const an = Math.random()*6.283;
  let x = car.x + Math.cos(an)*620, y = car.y + Math.sin(an)*620;
  x = Math.max(ROAD/2, Math.min(WW-ROAD/2, x)); y = Math.max(ROAD/2, Math.min(WH-ROAD/2, y));
  if(Math.random() < 0.5) x = roadX(nearI(x)); else y = roadY(nearJ(y));
  const c = {x, y, a:Math.random()*6.283, sp:0, mesh:makeCopMesh()};
  scene.add(c.mesh); cops.push(c);
}
function clearCops(){ for(const c of cops) scene.remove(c.mesh); cops.length = 0; }
function updateCops(dt){
  const goalX = roadX(nearI(car.x));
  for(const c of cops){
    const myX = roadX(nearI(c.x)), myY = roadY(nearJ(c.y));
    const onH = Math.abs(c.y-myY) < ROAD*0.5, onV = Math.abs(c.x-myX) < ROAD*0.5;
    let tx, ty;
    if(Math.abs(c.x - goalX) > 10 && !(onV && Math.abs(myX-goalX) < 1)){
      if(onH){ tx = goalX; ty = myY; } else { tx = myX; ty = myY; }
    } else { tx = goalX; ty = car.y; }
    if(Math.hypot(car.x-c.x, car.y-c.y) < 150){ tx = car.x; ty = car.y; }

    const want = Math.atan2(ty-c.y, tx-c.x);
    let da = ((want - c.a + Math.PI*3) % (Math.PI*2)) - Math.PI;
    c.a += Math.max(-4.2*dt, Math.min(4.2*dt, da*4));
    const top = 128 + Math.min(30, heat*0.25);
    c.sp += ((Math.abs(da) > 1.2 ? top*0.45 : top) - c.sp) * dt*1.8;

    const nx = c.x + Math.cos(c.a)*c.sp*dt, ny = c.y + Math.sin(c.a)*c.sp*dt;
    let stuck = 0;
    if(!solid(nx, c.y)) c.x = nx; else stuck++;
    if(!solid(c.x, ny)) c.y = ny; else stuck++;
    if(stuck){ c.sp *= 0.5; c.a += 0.9*dt; }

    if(Math.hypot(car.x-c.x, car.y-c.y) < 25) ticket();
  }
}
function addHeat(n, why, sub){
  if(calm()) return;                                  // в спокойном режиме патруля нет
  const was = heat;
  heat = Math.min(120, heat + n); lastViol = clock;
  if(why && clock - lastHit > 1.1){ lastHit = clock; toast(why, sub); }
  if(was < 50 && heat >= 50 && !cops.length){ spawnCop(); toast("Патруль засёк", "уходите от погони или получите штраф"); }
  if(heat >= 100 && cops.length < 2) spawnCop();
}
function ticket(){
  if(calm()){ clearCops(); heat = 0; return; }
  const fine = Math.max(30, Math.round(S.money*0.12));
  S.money = Math.max(0, S.money - fine);

/* точка у бордюра: машина встаёт в ближнюю к тротуару полосу, пассажир ждёт на тротуаре */
const rr = (a,b)=> a + Math.random()*(b-a);
const ri = (a,b)=> Math.floor(rr(a,b+1));
function roadPoint(){
  if(Math.random() < 0.5){                                   // вертикальная улица
    const i = ri(0,GW), gy = ri(0,GH-1);
    const side = i === 0 ? 1 : i === GW ? -1 : (Math.random() < 0.5 ? -1 : 1);
    const cx = roadX(i), y = gy*CELL + ROAD + rr(24, BLOCK-24);
    return {x: cx + side*15, y, sx: cx + side*(ROAD/2 + 3), sy: y, face: side > 0 ? Math.PI : 0,
      street: STREET_V[i], house: gy*20 + (i%2 ? ri(1,9)*2-1 : ri(1,9)*2)};
  }
  const j = ri(0,GH), gx = ri(0,GW-1);                        // поперечная
  const side = j === 0 ? 1 : j === GH ? -1 : (Math.random() < 0.5 ? -1 : 1);
  const cy = roadY(j), x = gx*CELL + ROAD + rr(24, BLOCK-24);
  return {x, y: cy + side*15, sx: x, sy: cy + side*(ROAD/2 + 3), face: side > 0 ? Math.PI/2 : -Math.PI/2,
    street: STREET_H[j], house: gx*20 + (j%2 ? ri(1,9)*2-1 : ri(1,9)*2)};
}

/* ---------- звук ---------- */
const SND = {ctx:null, on:!S.muted};
function audioBoot(){
  if(SND.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  let ctx; try{ ctx = new AC(); }catch(e){ return; }
  if(ctx.state === "suspended") ctx.resume().catch(()=>{});
  const master = ctx.createGain(); master.gain.value = SND.on ? 0.5 : 0; master.connect(ctx.destination);

  const eg = ctx.createGain(); eg.gain.value = 0;               // мотор
  const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 640; flt.Q.value = 3.5;
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.type = "sawtooth"; o2.type = "square"; o2.detune.value = -16;
  o1.frequency.value = 52; o2.frequency.value = 26;
  o1.connect(eg); o2.connect(eg); eg.connect(flt); flt.connect(master);
  o1.start(); o2.start();

  const sg = ctx.createGain(); sg.gain.value = 0;               // сирена
  const so = ctx.createOscillator(); so.type = "square"; so.frequency.value = 640;
  so.connect(sg); sg.connect(master); so.start();

  Object.assign(SND, {ctx, master, eg, flt, o1, o2, sg, so});
}
function blip(freq, dur, type, vol, when){
  if(!SND.ctx) return;
  const t = SND.ctx.currentTime + (when || 0);
  const o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.22, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, freq, vol){
  if(!SND.ctx) return;
  const ctx = SND.ctx, n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.1;
  const g = ctx.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(SND.master); src.start();
}
function sfx(kind){
  if(!SND.ctx || !SND.on) return;
  if(kind === "coin")   [660,880,1100,1320].forEach((f,i)=> blip(f, 0.16, "triangle", 0.2, i*0.055));
  if(kind === "level")  [523,659,784,1046,1318].forEach((f,i)=> blip(f, 0.26, "triangle", 0.22, i*0.09));
  if(kind === "crash"){ noiseBurst(0.34, 190, 0.5); blip(88, 0.22, "square", 0.26); }
  if(kind === "bump")   noiseBurst(0.14, 320, 0.24);
  if(kind === "fail"){  blip(330, 0.16, "sawtooth", 0.18); blip(196, 0.34, "sawtooth", 0.18, 0.15); }
  if(kind === "ticket"){ blip(880, 0.14, "square", 0.2); blip(587, 0.14, "square", 0.2, 0.16); blip(392, 0.4, "square", 0.2, 0.32); }
  if(kind === "ui")     blip(720, 0.08, "triangle", 0.14);
  if(kind === "shoot"){ blip(420, 0.1, "sine", 0.18); blip(640, 0.08, "sine", 0.1, 0.03); }
  if(kind === "splat")  noiseBurst(0.16, 700, 0.26);
  if(kind === "pop"){   noiseBurst(0.08, 2600, 0.5); blip(1320, 0.07, "square", 0.08); }
  if(kind === "honk"){  blip(392, 0.22, "square", 0.14); blip(494, 0.22, "square", 0.14); blip(392, 0.3, "square", 0.14, 0.28); blip(494, 0.3, "square", 0.14, 0.28); }
}
function audioFrame(){
  if(!SND.ctx) return;
  if(SND.ctx.state === "suspended" && S.started) SND.ctx.resume().catch(()=>{});
  const t = SND.ctx.currentTime, sp = Math.abs(car.sp), thr = keys.gas ? 1 : 0;
  const f = 46 + sp*1.3 + thr*18;
  SND.o1.frequency.setTargetAtTime(f, t, 0.06);
  SND.o2.frequency.setTargetAtTime(f*0.5, t, 0.06);
  SND.flt.frequency.setTargetAtTime(400 + sp*7 + thr*280, t, 0.08);
  SND.eg.gain.setTargetAtTime((S.started && !S.paused) ? 0.03 + thr*0.045 + Math.min(0.045, sp/2600) : 0, t, 0.12);
  let near = 1e9;
  for(const c of cops) near = Math.min(near, Math.hypot(c.x-car.x, c.y-car.y));
  SND.sg.gain.setTargetAtTime((cops.length && !S.paused) ? 0.15*(1 - Math.min(1, near/640)) : 0, t, 0.15);
  SND.so.frequency.setTargetAtTime(Math.floor(clock*2.4)%2 ? 900 : 620, t, 0.02);
}

/* одна InstancedMesh на цвет — надёжнее, чем per-instance цвета, и всё те же единицы вызовов */
function instanced(geo, items, colorOf, place, opts){
  const groups = new Map(), m = new THREE.Matrix4(), out = [];
  for(const it of items){
    const c = colorOf(it);
    if(!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  }
  groups.forEach((list, c)=>{
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({color:c}), list.length);
    list.forEach((it, i)=>{ place(it, m); mesh.setMatrixAt(i, m); });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;                 // сфера отсечения у InstancedMesh — от единичной геометрии
    if(opts && opts.cast) mesh.castShadow = true;
    if(opts && opts.receive) mesh.receiveShadow = true;
    scene.add(mesh); out.push(mesh);
  });
  return out;
}

/* --- уют: маркизы, вывески, балконы, кусты, клумбы — «декор», гасится на простом качестве --- */
const DECOR = [];
{
  const drnd = mulberry32(777), DR = (a,b)=> a + drnd()*(b-a);
  const AWN = ["#E4574B","#3C8FD8","#F2A93C","#3FA35B","#D65A9C","#8E6BD6"];
  const aw = [], sign = [], slab = [], rail = [], bush = [], dirt = [], flower = [], m0 = new THREE.Matrix4();
  // фасад дома, обращённый к ближайшей улице
  const front = (bd, b)=>{
    const d = [bd.y - b.oy, b.oy + BLOCK - bd.y - bd.h, bd.x - b.ox, b.ox + BLOCK - bd.x - bd.w];
    return d.indexOf(Math.min(...d));
  };
  const at = (bd, side, off, y, len, thick, depth, along)=>{
    const cx = bd.x + bd.w/2 + (side < 2 ? along : 0), cz = bd.y + bd.h/2 + (side >= 2 ? along : 0);
    if(side === 0) return {x:cx, y, z:bd.y - off, sx:len, sy:thick, sz:depth};
    if(side === 1) return {x:cx, y, z:bd.y + bd.h + off, sx:len, sy:thick, sz:depth};
    if(side === 2) return {x:bd.x - off, y, z:cz, sx:depth, sy:thick, sz:len};
    return {x:bd.x + bd.w + off, y, z:cz, sx:depth, sy:thick, sz:len};
  };
  const inside = (b, x, y, pad)=> b.buildings.some(bd => x > bd.x-pad && x < bd.x+bd.w+pad && y > bd.y-pad && y < bd.y+bd.h+pad);
  for(let gy=0; gy<GH; gy++) for(let gx=0; gx<GW; gx++){
    const b = blocks[gy][gx];
    for(const bd of b.buildings){
      if(bd.station) continue;
      const side = front(bd, b), flen = side < 2 ? bd.w : bd.h;
      if(bd.ht < 70 && drnd() < 0.7){
        const c = AWN[Math.floor(drnd()*AWN.length)];
        aw.push({...at(bd, side, 5, CURB + 15, flen*0.62, 1.6, 10, 0), c});
        aw.push({...at(bd, side, 10, CURB + 13.2, flen*0.62, 3.4, 0.8, 0), c:"#FFFFFF"});
        sign.push({...at(bd, side, 0.8, CURB + 23, flen*0.42, 6, 1.2, 0), c:AWN[Math.floor(drnd()*AWN.length)]});
      } else if(bd.ht >= 60 && flen > 34){
        const cols = flen > 70 ? [-flen/4, flen/4] : [0];
        for(let y = CURB + 32; y < CURB + bd.ht - 12; y += 26) for(const a of cols){
          slab.push(at(bd, side, 3, y, 15, 1.6, 6, a));
          rail.push(at(bd, side, 5.6, y + 2.8, 15, 4, 0.8, a));
        }
      }
    }
    // кусты и клумбы на свободных местах квартала
    const tries = b.park ? 14 : 8;
    for(let k=0; k<tries; k++){
      const x = b.ox + DR(10, BLOCK-10), y = b.oy + DR(10, BLOCK-10);
      if(inside(b, x, y, 7) || (b.station && y < b.oy + 120)) continue;
      if(drnd() < (b.park ? 0.35 : 0.3)){
        dirt.push({x, y:CURB + 1.2, z:y, sx:20, sy:2.4, sz:11, c:"#8B5E3C"});
        const FL = ["#E4574B","#F7D774","#F59AC4","#FFFFFF","#B784E0"];
        for(let f=0; f<7; f++) flower.push({x:x + DR(-8,8), y:CURB + 3.2, z:y + DR(-4,4), sx:1.8, sy:1.8, sz:1.8, c:FL[f % FL.length]});
      } else {
        const r = DR(4, 7);
        bush.push({x, y:CURB + r*0.55, z:y, sx:r*1.2, sy:r, sz:r*1.2, c:drnd() < 0.5 ? "#4FAE4A" : "#6CC158"});
      }
    }
  }
  const put = (it, m)=>{ m.makeScale(it.sx, it.sy, it.sz); m.setPosition(it.x, it.y, it.z); };
  const ball = new THREE.IcosahedronGeometry(1, 1);
  DECOR.push(...instanced(BOXG, aw, it => it.c, put, {cast:true}));
  DECOR.push(...instanced(BOXG, sign, it => it.c, put));
  DECOR.push(...instanced(BOXG, slab, ()=> "#F7F3EA", put, {cast:true}));
  DECOR.push(...instanced(BOXG, rail, ()=> "#5E6E7A", put));
  DECOR.push(...instanced(ball, bush, it => it.c, put));
  DECOR.push(...instanced(BOXG, dirt, it => it.c, put));
  DECOR.push(...instanced(BOXG, flower, it => it.c, put));
}

];
let nightF = 0, dayT = 0;
const WIN_DAY = new THREE.Color("#6FA3C4"), WIN_NIGHT = new THREE.Color("#FFD79A"),
  WIN_WHITE = new THREE.Color("#FFFFFF"), WIN_DUSK = new THREE.Color("#5A6788"), CLOUD_EM = new THREE.Color("#DDE8F0");
const cA = new THREE.Color(), cB = new THREE.Color();
const lerpN = (a,b,k)=> a + (b-a)*k;
function updateSky(){
  dayT = (clock/DAYLEN) % 1;
  let i = 0; while(i < PHASES.length-2 && dayT >= PHASES[i+1].t) i++;
  const a = PHASES[i], b = PHASES[i+1], k = Math.min(1, Math.max(0, (dayT - a.t)/(b.t - a.t)));
  cA.set(a.sky); cB.set(b.sky);
  scene.background.copy(cA).lerp(cB, k);
  scene.fog.color.copy(scene.background);
  scene.fog.near = lerpN(a.near, b.near, k); scene.fog.far = lerpN(a.far, b.far, k);
  cA.set(a.sun); cB.set(b.sun); sun.color.copy(cA).lerp(cB, k);
  sun.intensity = lerpN(a.si, b.si, k);
  cA.set(a.hs); cB.set(b.hs); hemi.color.copy(cA).lerp(cB, k);
  cA.set(a.hg); cB.set(b.hg); hemi.groundColor.copy(cA).lerp(cB, k);
  hemi.intensity = lerpN(a.hi, b.hi, k);
  const ang = dayT*Math.PI*2 + 2.3;
  SUN_OFF.set(Math.cos(ang)*245, lerpN(a.el, b.el, k), Math.sin(ang)*245);
  nightF = lerpN(a.night, b.night, k);
  const dark = nightF > 0.3;
  lampGlow.visible = dark;
  winMesh.material.color.copy(WIN_DAY).lerp(WIN_NIGHT, Math.min(1, nightF*1.6));
  cloudMat.color.copy(WIN_WHITE).lerp(WIN_DUSK, nightF); cloudMat.emissive.copy(CLOUD_EM).multiplyScalar(1 - nightF*0.85);
  if(taxi){
    for(const o of taxi.userData.night) o.visible = dark;
    const pt = taxi.userData.paint;                  // ночью такси чуть светится, чтобы не сливалось с дорогой
    pt.body.emissive.copy(pt.body.color).multiplyScalar(nightF*0.32);
    pt.hood.emissive.copy(pt.hood.color).multiplyScalar(nightF*0.32);
  }
}

function makeHead(a){

  const dark = new THREE.MeshLambertMaterial({color:"#1B282C"});
  const nose = new THREE.MeshLambertMaterial({color:a.nose});
  const owl  = a.ear === "tuft";

  const head = bit(SPH, fur, 3.6, 3.6, 3.6, 0, 0, 0);

  if(a.shell) g.add(bit(SPH, new THREE.MeshLambertMaterial({color:"#4E8050"}), 3.4, 2.2, 3.8, -3.4, -1.8, 0));
  if(a.mask)  g.add(bit(BOXG, new THREE.MeshLambertMaterial({color:"#3A464E"}), 1.4, 1.7, 6.6, 2.2, 0.7, 0));
  if(a.spots) for(let i=0;i<6;i++){

      Math.cos(an)*1.6, Math.sin(an)*2.2 + 0.4, Math.cos(an*1.7)*3.2));
  }

  g.add(bit(SPH, fur2, 1.8, 1.5, 2.0, 2.6, -0.8, 0));                       // морда
  g.add(bit(owl ? CONE : SPH, nose, owl ? 0.9 : 0.7, owl ? 1.6 : 0.6, 0.9,  // нос или клюв
    owl ? 3.6 : 4.1, owl ? -0.9 : -0.6, 0));

const SPL = new THREE.SphereGeometry(1, 10, 8), CNL = new THREE.ConeGeometry(1, 1, 6), CYLL = new THREE.CylinderGeometry(1, 1, 1, 8);
const _mm = new THREE.Matrix4(), _mq = new THREE.Quaternion(), _me = new THREE.Euler(), _mc = new THREE.Color();
const _mp = new THREE.Vector3(), _ms = new THREE.Vector3();
function mergeParts(parts){
  const pos = [], nor = [], col = [];
  for(const [geo, color, sx, sy, sz, px, py, pz, rx, rz] of parts){
    const g = geo.toNonIndexed();
    _me.set(rx || 0, 0, rz || 0); _mq.setFromEuler(_me);
    _mm.compose(_mp.set(px, py, pz), _mq, _ms.set(sx, sy, sz));
    g.applyMatrix4(_mm);
    const P = g.attributes.position.array, N = g.attributes.normal.array;
    for(let i=0;i<P.length;i++){ pos.push(P[i]); nor.push(N[i]); }
    _mc.set(color);
    for(let i=0;i<P.length/3;i++) col.push(_mc.r, _mc.g, _mc.b);
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}

const PED_N = 26;

const peds = [];
let lastPed = -9;
function pedSpot(p){
  const gx = Math.max(0, Math.min(GW-1, nearI(car.x) + (Math.random()*5|0) - 2));
  const gy = Math.max(0, Math.min(GH-1, nearJ(car.y) + (Math.random()*5|0) - 2));
  p.b = blocks[gy][gx];
  p.t = Math.random();
  p.sp = (0.030 + Math.random()*0.022) * (Math.random() < 0.5 ? -1 : 1);
  p.ph = Math.random()*6.283; p.scared = 0;
  p.mesh.geometry = animalGeo(PASSENGERS[Math.random()*PASSENGERS.length|0], COATS[Math.random()*COATS.length|0]);
}
function pedPos(p){
  const W = BLOCK + 10, x0 = p.b.ox - 5, y0 = p.b.oy - 5;
  const u = (((p.t % 1) + 1) % 1) * 4, k = u | 0, f = u - k;
  if(k === 0) return [x0 + f*W, y0, 0];
  if(k === 1) return [x0 + W, y0 + f*W, 1];
  if(k === 2) return [x0 + (1-f)*W, y0 + W, 2];
  return [x0, y0 + (1-f)*W, 3];
}
for(let i=0;i<PED_N;i++){
  const m = new THREE.Mesh(SPL, animalMat);

}
function hitPed(p){
  if(clock - lastPed < 1.4) return;
  lastPed = clock;
  if(S.order) S.order.crashes++;
  S.dirt = Math.min(1, S.dirt + 0.03);
  if(calm()) toast("Осторожно, пешеход!", "по тротуару ездить нельзя");
  else { S.rating = Math.max(1, S.rating*0.88 + 1.2*0.12);
         addHeat(45, "Наезд на тротуаре", "пешеход цел, но патруль в ярости"); }

}
function updatePeds(dt){
  for(const p of peds){
    p.t += p.sp*dt*(p.scared > 0 ? 2.8 : 1);
    const pos = pedPos(p), x = pos[0], y = pos[1];
    if(Math.hypot(x-car.x, y-car.y) > 720){ pedSpot(p); continue; }
    p.scared = Math.max(0, p.scared - dt);
    const d = Math.hypot(x-car.x, y-car.y);
    if(d < 36 && Math.abs(car.sp) > 34) p.scared = Math.max(p.scared, 1.1);
    if(d < 10 && Math.abs(car.sp) > 42) hitPed(p);
    const gait = Math.sin(clock*(p.scared > 0 ? 17 : 8) + p.ph);
    p.mesh.position.set(x, CURB + Math.abs(gait)*0.8, y);
    p.mesh.rotation.y = -(pos[2]*Math.PI/2 + (p.sp < 0 ? Math.PI : 0));
    p.mesh.rotation.x = gait*0.1;                         // вперевалочку
  }
}

/* --- пассажир: фигурка на остановке, посадка, высадка с маханием лапой --- */
const figs = [];
let waitFig = null;
function makeFig(a){
  const g = new THREE.Group();
  const body = new THREE.Mesh(animalGeo(a, COATS[Math.random()*COATS.length|0], true), animalMat);
  body.castShadow = true; g.add(body);

  arm.add(am); g.add(arm);

  scene.add(g);
  const f = {g, arm, mode:"wait", t:0, x:0, y:0, face:0, fx:0, fy:0, tx:0, ty:0};
  figs.push(f);
  while(figs.length > 4) dropFig(figs[0]);
  return f;
}
function dropFig(f){ scene.remove(f.g); const i = figs.indexOf(f); if(i >= 0) figs.splice(i, 1); if(f === waitFig) waitFig = null; }
function showWaiting(){
  hideWaiting();
  const o = S.order; if(!o) return;
  const f = makeFig(PASSENGERS[o.kind]);
  f.x = o.from.sx; f.y = o.from.sy; f.face = o.from.face;
  waitFig = f;
}
function hideWaiting(){ if(waitFig) dropFig(waitFig); }
function boardPax(o){
  if(waitFig){ const f = waitFig; waitFig = null; f.mode = "board"; f.t = 0; f.fx = f.x; f.fy = f.y; }
  taxiPax(o.kind);
}
function dropPax(o){
  taxiPax(null);
  const f = makeFig(PASSENGERS[o.kind]);
  f.mode = "leave"; f.t = 0;
  f.fx = car.x; f.fy = car.y; f.x = car.x; f.y = car.y;
  f.tx = o.to.sx; f.ty = o.to.sy; f.face = o.to.face;
}
function updateFigs(dt){
  for(const f of figs.slice()){
    f.t += dt;
    let wave = 0, y = CURB, rot = f.face, sc = 1.15;
    if(f.mode === "wait"){
      const near = S.order && S.order.phase === "pickup" && Math.hypot(f.x-car.x, f.y-car.y) < 280;
      wave = near || (f.t % 6) < 1.4 ? 1 : 0;
      y += Math.abs(Math.sin(f.t*(near ? 7 : 2)))*(near ? 1.2 : 0.3);
    } else if(f.mode === "board"){
      const k = Math.min(1, f.t/0.55);
      f.x = f.fx + (car.x - f.fx)*k; f.y = f.fy + (car.y - f.fy)*k;
      rot = -Math.atan2(car.y - f.fy, car.x - f.fx);
      y += Math.abs(Math.sin(f.t*16))*1.2; sc = 1.15*(1 - k*0.7);
      if(k >= 1){ dropFig(f); continue; }
    } else if(f.mode === "leave"){
      const k = Math.min(1, f.t/0.8);
      f.x = f.fx + (f.tx - f.fx)*k; f.y = f.fy + (f.ty - f.fy)*k;
      rot = -Math.atan2(f.ty - f.fy, f.tx - f.fx);
      y += Math.abs(Math.sin(f.t*14))*1.4; sc = 1.15*(0.4 + k*0.6);
      if(k >= 1){ f.mode = "wave"; f.t = 0; }
    } else if(f.mode === "wave"){
      wave = 1; y += Math.abs(Math.sin(f.t*5))*0.8;
      if(f.t > 3.4){ f.mode = "bye"; f.t = 0; }
    } else {
      rot = f.face + Math.PI; y += Math.abs(Math.sin(f.t*12))*1;   // уходит от дороги
      f.x -= Math.cos(f.face)*14*dt; f.y += Math.sin(f.face)*14*dt;
      if(f.t > 2.2){ dropFig(f); continue; }
    }
    f.g.position.set(f.x, y, f.y);
    f.g.rotation.y = rot;
    f.g.scale.setScalar(sc);
    f.arm.rotation.x = wave ? -2.55 + Math.sin(f.t*12)*0.42 : -0.25;
  }
}

function fire(){
  if(fireCd > 0) return;
  fireCd = FIRE_CD;
  const c = Math.cos(car.a), s = Math.sin(car.a);
  const x0 = car.x + c*13, y0 = 13, z0 = car.y + s*13, H = SHOT_H + Math.max(0, car.sp);
  // мягкое автоприцеливание: ближайшая цель впереди (шар или такси друга)
  let best = null, bestScore = 1e9;
  const look = (tx, ty, tz)=>{
    const dx = tx - x0, dz = tz - z0, D = Math.hypot(dx, dz);
    if(D < 30 || D > 430) return;
    const dot = (dx*c + dz*s)/D;
    if(dot < 0.88) return;
    const sc = D*(2 - dot);
    if(sc < bestScore){ bestScore = sc; best = {dx, dz, D, dy: ty - y0}; }
  };
  for(const b of balloons) if(b.gone <= 0) look(b.x, b.y, b.z);
  if(NET.st === "on") for(const o of NET.others.values()) look(o.mesh.position.x, 9, o.mesh.position.z);
  let vx, vy, vz;
  if(best){
    const T = best.D/H;
    vx = best.dx/best.D*H; vz = best.dz/best.D*H; vy = (best.dy + 0.5*SHOT_G*T*T)/T;
  } else { vx = c*H; vz = s*H; vy = 75; }
  spawnShot(x0, y0, z0, vx, vy, vz, S.color, true);
  sfx("shoot");
  if(NET.st === "on"){
    const r = v => Math.round(v*10)/10;
    netSend({t:"f", id:NET.me, x:r(x0), y:r(y0), z:r(z0), vx:r(vx), vy:r(vy), vz:r(vz), c:S.color});
  }
}
function netShot(m){
  if(m.id === NET.me) return;
  const v = [m.x, m.y, m.z, m.vx, m.vy, m.vz];
  if(!v.every(isFinite) || v.some(a => Math.abs(a) > 5000)) return;
  if(shots.length > 40) return;

}

        const dx = o.mesh.position.x - b.x, dz = o.mesh.position.z - b.z;

const camPos = new THREE.Vector3(car.x, 60, car.y + 90);

const tmp = new THREE.Vector3();
function syncScene(dt){
  taxi.position.set(car.x, 0, car.y);
  taxi.rotation.y = -car.a;
  taxi.rotation.z = car.roll;
  if(driverHead) driverHead.rotation.y = -(car.steer||0)*0.4;

  for(const c of cops){

    c.mesh.userData.bar[0].color.set(on ? "#2F6FD0" : "#D24437");

  updateSkids(dt);
  updateFigs(dt);
  updateStationFx(dt);

  const empty = S.fuel <= 0, tg = empty ? navTarget() : target();

    markerGroup.visible = true;
    markerGroup.position.set(tg.x, 0, tg.y);

    const pulse = 1 + Math.sin(clock*3)*0.12;
    ring.scale.set(pulse, pulse, 1);
    arrowPivot.visible = viewMode !== 2;
    arrowPivot.position.set(car.x, 27 + Math.sin(clock*2.4)*1.2, car.y);
    const camYaw = Math.atan2(-(camAim.x - camPos.x), -(camAim.z - camPos.z));
    arrowPivot.rotation.set(viewMode === 1 ? 0 : 0.95, camYaw, 0);      // сверху — лежит плашмя
    arrowSpin.rotation.y = -Math.atan2(tg.y-car.y, tg.x-car.x) - camYaw;
    arrowSpin.scale.setScalar((viewMode === 1 ? 1.1 : 0.58) * (1 + Math.sin(clock*4)*0.06));
  } else { markerGroup.visible = false; arrowPivot.visible = false; }

  // солнце едет за такси, чтобы тени были всегда рядом
  sun.position.set(car.x + SUN_OFF.x, SUN_OFF.y, car.y + SUN_OFF.z);
  sun.target.position.set(car.x, 0, car.y);
  sun.target.updateMatrixWorld();

  const ca = Math.cos(car.a), sa = Math.sin(car.a);
  const k = 1 - Math.exp(-dt*(viewMode === 0 ? 5.5 : viewMode === 1 ? 4 : 6.5));
  if(viewMode === 2){
    // портрет: камера перед капотом, смотрит на голову водителя
    const hx = car.x + 1.2*ca + 3.1*sa, hz = car.y + 1.2*sa - 3.1*ca;
    const sw = Math.sin(clock*0.4)*0.22;
    tmp.set(hx + Math.cos(car.a + sw)*27, 21.5, hz + Math.sin(car.a + sw)*27);
    camPos.lerp(tmp, k);
    tmp.set(hx, 15.4, hz);
    camAim.lerp(tmp, k);
  } else {
    let back = 62 + Math.abs(car.sp)*0.22, high = 30 + Math.abs(car.sp)*0.06;
    if(viewMode === 0){
      // камера не заходит в кварталы: укорачиваем плечо и поднимаемся выше
      for(let d = 8; d <= back; d += 6){
        if(camBlocked(car.x - ca*d, car.y - sa*d)){ const cut = Math.max(20, d - 8); high += (back - cut)*0.55; back = cut; break; }
      }
      tmp.set(car.x - ca*back, high, car.y - sa*back);
    }
    else               tmp.set(car.x - ca*40, 210, car.y - sa*40);
    camPos.lerp(tmp, k);
    tmp.set(car.x + ca*36, viewMode === 0 ? 9 : 0, car.y + sa*36);
    camAim.lerp(tmp, k);
  }
  camera.position.copy(camPos);
  camera.lookAt(camAim);

  const wantFov = viewMode === 1 ? 56 : viewMode === 2 ? 44 : 56 + Math.min(15, Math.abs(car.sp)*0.13);
  if(Math.abs(camera.fov - wantFov) > 0.04){
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt*3.2);
    camera.updateProjectionMatrix();
  }
  if(shake > 0.01){
    camera.position.x += (Math.random()-0.5)*shake;
    camera.position.y += (Math.random()-0.5)*shake;
    camera.position.z += (Math.random()-0.5)*shake;
    camera.rotation.z += (Math.random()-0.5)*shake*0.006;
    shake *= Math.exp(-dt*4.5);
  } else shake = 0;
}
/* ---------- качество: 2 — высокое, 1 — среднее, 0 — простое (без теней и мелкого декора) ---------- */
const QUAL = [{pr:1, sh:0}, {pr:1.35, sh:1024}, {pr:1.8, sh:2048}];
const QNAME = {auto:"авто", "2":"высокая", "1":"средняя", "0":"простая"};
const coarse = matchMedia("(pointer:coarse)").matches;
let qLevel = -1;
function applyQuality(l){
  l = Math.max(0, Math.min(2, l));
  if(l === qLevel) return;
  qLevel = l;
  const Q = QUAL[l];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.pr));
  sun.castShadow = Q.sh > 0;
  if(Q.sh && sun.shadow.mapSize.x !== Q.sh){
    sun.shadow.mapSize.set(Q.sh, Q.sh);
    if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  for(const d of DECOR) d.visible = l > 0;
  resize();
}
function pickQuality(){ applyQuality(S.quality === "auto" ? (coarse ? 1 : 2) : +S.quality); }
// авто: после прогрева мерим средний кадр окнами по 3 с; два плохих окна подряд — ступенька вниз
const perf = {warm:4, t:0, n:0, bad:0};
function watchPerf(raw){
  if(S.quality !== "auto" || S.paused || !S.started || document.hidden || raw > 0.25 || qLevel <= 0) return;
  if(perf.warm > 0){ perf.warm -= raw; return; }
  perf.t += raw; perf.n++;
  if(perf.t < 3) return;
  const fps = perf.n / perf.t; perf.t = 0; perf.n = 0;
  if(fps < 40){ if(++perf.bad >= 2){ perf.bad = 0; perf.warm = 3; applyQuality(qLevel - 1); } }
  else perf.bad = 0;
}
function resize(){

  renderer.setSize(w, h, false);

const mc = document.getElementById("mini"), mx = mc.getContext("2d");
function drawMini(){

  }
  for(const c of cops){
    mx.fillStyle = Math.floor(clock*6)%2 ? "#2F6FD0" : "#D24437";
    mx.beginPath(); mx.arc(c.x*sx, c.y*sy, 4, 0, 6.283); mx.fill();
  }
  balMini(sx, sy); netMini(sx, sy);
  mx.fillStyle = PAINTS[S.color].c; mx.strokeStyle = "#2B343A"; mx.lineWidth = 1.5;
  mx.beginPath(); mx.arc(car.x*sx, car.y*sy, 4, 0, 6.283); mx.fill(); mx.stroke();

/* ---------- управление ---------- */
const keys = {};
const KMAP = {ArrowUp:"gas", KeyW:"gas", ArrowDown:"brake", KeyS:"brake", ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right"};
addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest("input")) return;
  if(KMAP[e.code]){ keys[KMAP[e.code]] = true; e.preventDefault(); }
  if((e.code === "Space" || e.code === "KeyF") && veil.hidden){ if(!e.repeat) fireTap = true; keys.fire = true; e.preventDefault(); }
  if(e.code === "KeyC") nextView();
  if(e.code === "KeyM") toggleSound();
  if(e.code === "Escape"){ if(veil.hidden && S.started) pauseMenu(); else if(!veil.hidden && S.started) closeSheet(); }
});
addEventListener("keyup", e=>{ if(KMAP[e.code]) keys[KMAP[e.code]] = false; if(e.code === "Space" || e.code === "KeyF") keys.fire = false; });
function clearKeys(){
  for(const k in keys) keys[k] = false;
  document.querySelectorAll("#touch .pad").forEach(p=> p.classList.remove("act"));
}
addEventListener("blur", clearKeys);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) clearKeys(); });
addEventListener("pointerdown", ()=>{ audioBoot(); try{ window.focus(); }catch(e){} }, true);
document.querySelectorAll("#touch .pad").forEach(p=>{
  let pid = null;
  const set = on =>{ keys[p.dataset.k] = on; p.classList.toggle("act", on); if(on && p.dataset.k === "fire") fireTap = true; };
  p.addEventListener("pointerdown", e=>{
    e.preventDefault(); pid = e.pointerId;
    try{ p.setPointerCapture(e.pointerId); }catch(err){}
    set(true);
  });
  const end = e=>{ if(pid !== null && e.pointerId !== pid) return; pid = null; set(false); };
  p.addEventListener("pointerup", end);
  p.addEventListener("pointercancel", end);
  p.addEventListener("lostpointercapture", end);
  p.addEventListener("contextmenu", e=> e.preventDefault());
});

/* ---------- обновление ---------- */
function update(dt){
  clock += dt;
  updateShots(dt);
  const P = stats();
  if(keys.gas) car.sp += P.acc*dt;
  else if(keys.brake) car.sp -= (car.sp > 3 ? P.acc*1.9 : P.acc*1.1)*dt;
  car.sp *= (1 - 1.05*dt);
  car.sp = Math.max(-P.max*0.45, Math.min(P.max, car.sp));
  if(S.fuel <= 0) car.sp = Math.max(-CRAWL, Math.min(CRAWL, car.sp));   // пустой бак: еле ползём

  const grip = Math.min(1, Math.abs(car.sp)/34), dir = car.sp < 0 ? -1 : 1;
  let steer = 0;
  if(keys.left)  steer -= 1;
  if(keys.right) steer += 1;
  car.a += steer * P.turn*dt*grip*dir;
  car.roll += (steer * grip * -0.07 - car.roll) * Math.min(1, dt*6);
  car.steer = steer;
  skidT -= dt;
  if(skidT <= 0 && Math.abs(car.sp) > 52 && ((steer && grip > 0.85) || (keys.brake && car.sp > 62))){ skid(); skidT = 0.045; }

  const nx = car.x + Math.cos(car.a)*car.sp*dt, ny = car.y + Math.sin(car.a)*car.sp*dt;
  let blocked = 0;
  if(!hits(nx, car.y)) car.x = nx; else blocked++;
  if(!hits(car.x, ny)) car.y = ny; else blocked++;
  if(blocked && !P.armor){
    const now = performance.now()/1000;
    if(now - S.lastBump > 1 && Math.abs(car.sp) > 30){
      S.lastBump = now; if(S.order) S.order.crashes++;
      sfx("bump"); shake = Math.min(3, Math.abs(car.sp)*0.03);
    }
    car.sp *= 0.45;
  }
  if(blocked === 2){
    stuckT += dt;
    if(stuckT > 0.45){
      const ux = roadX(nearI(car.x)) - car.x, uy = roadY(nearJ(car.y)) - car.y, ul = Math.hypot(ux,uy) || 1;
      car.x += ux/ul*46*dt; car.y += uy/ul*46*dt; car.sp *= 0.5;
    }
  } else stuckT = 0;
  car.x = Math.max(10, Math.min(WW-10, car.x)); car.y = Math.max(10, Math.min(WH-10, car.y));

  updateTraffic(dt);
  updatePeds(dt);
  if(cops.length) updateCops(dt);

  for(const v of traffic){
    const ddx = v.x-car.x, ddy = v.y-car.y, d = Math.hypot(ddx, ddy) || 0.001;
    if(d < 22){
      const n = (22-d)/d;
      car.x -= ddx*n*0.6; car.y -= ddy*n*0.6;
      v.x += ddx*n*0.5; v.y += ddy*n*0.5; v.sp *= 0.5;
      const into = (Math.cos(car.a)*ddx + Math.sin(car.a)*ddy)/d;
      if((car.sp > 0 && into > 0.3) || (car.sp < 0 && into < -0.3)){
        const hard = Math.abs(car.sp) > 42;
        if(hard && clock - lastHit > 1.1){
          if(S.order) S.order.crashes++;
          S.dirt = Math.min(1, S.dirt + 0.03);
          if(calm()){ lastHit = clock; toast("Бум! Осторожнее", "авария — минус звезда за поездку"); }
        }
        car.sp *= P.armor ? 0.75 : (hard ? -0.2 : 0.4);
        if(hard){ addHeat(30, "ДТП с попутной машиной", "патруль это заметил"); sfx("crash"); shake = 3.6; }
      }
    }
  }

  const ax = Math.abs(Math.cos(car.a)) > Math.abs(Math.sin(car.a)) ? "h" : "v";
  const ii = nearI(car.x), jj = nearJ(car.y), key = ii+":"+jj;
  if(Math.abs(car.x-roadX(ii)) < ROAD/2 && Math.abs(car.y-roadY(jj)) < ROAD/2){
    if(key !== lastCross && ax !== greenAxis() && !amberNow() && Math.abs(car.sp) > 55){
      lastCross = key;
      if(S.order) S.order.reds++;
      if(calm()){ if(clock - lastHit > 1.1){ lastHit = clock; toast("Красный свет!", "в следующий раз подожди зелёный"); } }
      else addHeat(18, "Проезд на красный", "перекрёсток " + key.replace(":", "×"));
    } else lastCross = key;
  }

  if(clock - lastViol > 3) heat = Math.max(0, heat - 5.5*dt);
  if(cops.length && heat <= 14){ clearCops(); toast("Оторвались", "патруль потерял такси из виду"); }

  updateCar(dt);
  if(!S.order) return;
  const o = S.order, tg = target();
  if(S.fuel > 0) o.patience = Math.max(0, o.patience - dt);   // пока бак пуст, пассажир терпеливо ждёт
  if(o.patience <= 0){
    if(o.phase === "pickup"){
      if(calm()) o.lateP = true; else { failOrder(false); return; }
    } else {
      o.late = (o.late || 0) + dt;
      if(!calm() && o.late > 28){ failOrder(true); return; }
    }
  }
  if(o.phase === "ride") o.ridden += Math.abs(car.sp)*dt;

  if(Math.hypot(car.x-tg.x, car.y-tg.y) < 32 && Math.abs(car.sp) < 26){
    if(o.phase === "pickup"){
      o.phase = "ride"; setPatience();
      boardPax(o);
      toast("Пассажир в салоне", `${o.who} · едем на ${o.to.street}`); paintOrder();
    } else finish();
  }
}
function hits(x,y){
  const w = 24, h = 13, c = Math.cos(car.a), s = Math.sin(car.a);
  for(const [ox,oy] of [[w/2,h/2],[w/2,-h/2],[-w/2,h/2],[-w/2,-h/2],[0,0]])
    if(solid(x + ox*c - oy*s, y + ox*s + oy*c)) return true;
  return false;
}

function finish(){
  const o = S.order, P = stats();
  const meters = Math.max(o.ridden, Math.hypot(o.from.x-o.to.x, o.from.y-o.to.y)*0.9) * M_PER_PX;
  const fare = Math.round((BOARD + meters*PER_M) * P.fare);
  const left = (o.patience / o.patMax) * (o.lateP ? 0.5 : 1);
  const clean = 1 - 0.6*S.dirt;                                  // грязная машина — меньше чаевых
  const tip = Math.round(fare * 0.4 * left * P.tips * clean);
  const total = fare + tip;

  const late = o.lateP || o.patience <= 0;
  const stars = Math.max(1, 3 - (late ? 1 : 0) - (o.crashes ? 1 : 0) - (o.reds ? 1 : 0));
  const score = 5 - Math.min(2, o.crashes*0.6) - (late ? 1.2 : 0);
  S.rating = Math.max(1, Math.min(5, S.rating*0.85 + score*0.15));
  S.money += total; S.orders++; S.shiftOrders++; S.shiftMoney += total; S.stars += stars;
  netRide();
  coins(); sfx("coin");
  const why = [late ? "опоздали" : "", o.crashes ? "авария" : "", o.reds ? "красный свет" : ""].filter(Boolean).join(", ");
  toast(`+${total.toLocaleString("ru-RU")} ж`, `счётчик ${fare} ж · чаевые ${tip} ж${S.dirt > 0.4 ? " · грязное такси" : ""}`);
  starPop(stars, why);
  dropPax(o);

  const fresh = !S.album[o.who];
  if(fresh){
    S.album[o.who] = true;
    setTimeout(()=>{ toast(`${avatar(PASSENGERS[o.kind], 34)}<span>Новая наклейка: ${o.who}</span>`,
      `альбом: ${Object.keys(S.album).length} из ${PASSENGERS.length}`, "sticker"); sfx("level"); }, 900);
  }
  taskProgress("rides", 1);
  taskProgress("stars", stars);
  if(stars === 3) taskProgress("perfect", 1);
  if(!o.reds) taskProgress("green", 1);
  taskKind(o.who);
  save();

  if(S.orders % 10 === 0 && S.unlocked < CREW.length){
    S.unlocked++; S.order = null; paintHUD(); save(); sfx("level");
    setTimeout(()=> unlockSheet(CREW[S.unlocked-1]), 1600);
    return;
  }
  newOrder(); paintHUD();
}

/* ---------- срыв заказа и конец смены ---------- */
function failOrder(mid){
  const o = S.order;
  S.fails++; S.shiftFails++;
  S.rating = Math.max(1, S.rating*0.78 + 0.8*0.22);
  if(mid){
    const paid = Math.round(BOARD * stats().fare);
    S.money += paid;
    toast(`Пассажир (${o.who}) вышел на полпути`, `оплачена только посадка · ${paid} ж`);

    toast(`Пассажир (${o.who}) не дождался`, `заказ сорван · рейтинг ${S.rating.toFixed(2)}`);
  }
  sfx("fail");
  hideWaiting(); taxiPax(null);
  S.order = null; save(); paintHUD(); paintOrder();
  if(ratingCheck()) return;

}
function ratingCheck(){

  }

}

function newShift(){

/* ---------- ежедневные задания ---------- */
const TASKS = {
  rides:   {n:[4,6], text:n=>`Отвези ${n} пассажиров`, reward:80},
  stars:   {n:[9,12], text:n=>`Собери ${n} звёзд`, reward:80},
  wash:    {n:[1,1], text:()=>"Помой такси на мойке", reward:40},
  fuel:    {n:[1,1], text:()=>"Заправь такси", reward:40},
  perfect: {n:[2,3], text:n=>`${n} поездки на три звезды`, reward:90},
  kinds:   {n:[3,4], text:n=>`Прокати ${n} разных зверей`, reward:70},
  paint:   {n:[1,1], text:()=>"Перекрась такси", reward:50},
  pop:     {n:[5,8], text:n=>`Лопни ${n} воздушных шаров`, reward:60},
  green:   {n:[3,4], text:n=>`${n} поездки без красного света`, reward:70}
};
function today(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dailyValid(d){
  return d && d.date === today() && Array.isArray(d.list) && d.list.length === 3 &&
    d.list.every(t => t && TASKS[t.id] && typeof t.n === "number" && typeof t.p === "number") && Array.isArray(d.kinds);
}
function ensureDaily(){
  if(dailyValid(S.daily)) return false;
  const day = today(), r = mulberry32(+day.replace(/-/g, ""));
  const pool = Object.keys(TASKS).filter(k => k !== "rides");
  const pick = ["rides"];
  while(pick.length < 3){ const k = pool[Math.floor(r()*pool.length)]; if(!pick.includes(k)) pick.push(k); }
  S.daily = {date:day, kinds:[], list: pick.map(id=>{
    const [a,b] = TASKS[id].n;
    return {id, n: a + Math.floor(r()*(b-a+1)), p:0, done:false};
  })};
  save();
  return true;
}
function taskProgress(id, amount){
  ensureDaily();
  for(const t of S.daily.list){
    if(t.id !== id || t.done) continue;
    t.p = Math.min(t.n, t.p + amount);
    if(t.p >= t.n){
      t.done = true;                                   // флаг сохраняется — награду нельзя получить дважды
      const rw = TASKS[id].reward;
      S.money += rw;
      setTimeout(()=>{ toast(`Задание выполнено: +${rw} ж`, TASKS[id].text(t.n), "good"); sfx("level"); }, 1400);
    }
  }
  save(); paintBadge();
}
function taskKind(who){
  ensureDaily();
  if(!S.daily.kinds.includes(who)){ S.daily.kinds.push(who); taskProgress("kinds", 1); }
}
function paintBadge(){
  if(!S.daily) return;
  const d = S.daily.list.filter(t => t.done).length, b = el("taskBadge");
  b.textContent = d + "/3"; b.classList.toggle("done", d === 3);
}

function toast(t, s, cls){

let starT = 0;
