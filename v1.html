<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Хвостоград Такси 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --sky:#CFE3EC;
  --paper:#FFFFFF;
  --paper-2:#F2F5F3;
  --line:#D3DCD8;
  --ink:#1D2A2B;
  --muted:#6B7F80;
  --amber:#EE9B2E;
  --amber-hot:#FFB65A;
  --amber-deep:#C97A16;
  --leaf:#4E9B5F;
  --coral:#E0574B;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Manrope","Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}

#stage{position:fixed;inset:0;background:var(--sky)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:absolute;inset:0;pointer-events:none;padding:14px;display:grid;
  grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:12px;
  grid-template-areas:"driver order purse" ". . ." "meter touch map";}
.hud > *{pointer-events:auto}

.plate{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 18px rgba(31,54,54,.14);backdrop-filter:blur(4px)}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}

#driverChip{grid-area:driver;display:flex;align-items:center;gap:10px;padding:7px 15px 7px 7px;border-radius:999px;
  background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 6px 18px rgba(31,54,54,.14)}
#driverChip svg{width:54px;height:54px;flex:none}
#driverChip .nm{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.1}
#driverChip .pk{font-size:11px;color:var(--amber-deep);font-weight:700}

#orderCard{grid-area:order;justify-self:center;min-width:min(420px,90vw);max-width:520px;padding:10px 14px 12px}
#orderCard .goal{font-family:var(--display);font-weight:600;font-size:15px;text-wrap:balance}
#orderCard .addr{font-size:13px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:12px}
#orderCard .addr b{color:var(--ink);font-weight:800}
#orderCard .dist{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--amber-deep)}
.bar{height:5px;border-radius:3px;background:#E3EAE6;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--amber));transition:width .2s linear}
.bar.low i{background:linear-gradient(90deg,var(--coral),#EE9B2E)}

#heatChip{position:absolute;left:50%;top:86px;transform:translateX(-50%);z-index:3;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.94);border:1px solid #C3D2DE;box-shadow:0 6px 18px rgba(31,54,54,.16)}
#heatChip[hidden]{display:none}
#heatChip .siren{width:11px;height:11px;border-radius:50%;background:#2F6FD0;animation:siren 1s steps(1) infinite}
#heatChip .txt{font-size:12px;font-weight:800}
#heatChip .hbar{width:96px;height:5px;border-radius:3px;background:#E3EAE6;overflow:hidden}
#heatChip .hbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2F6FD0,#D24437);transition:width .25s linear}
@keyframes siren{0%{background:#2F6FD0}50%{background:#D24437}100%{background:#2F6FD0}}

#purse{grid-area:purse;justify-self:end;padding:9px 14px;text-align:right;min-width:158px}
#purse .money{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--amber-deep);line-height:1.1}
#purse .row{display:flex;gap:14px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#purse .row b{color:var(--ink);font-weight:800}
#nextUp{margin-top:8px}
#nextUp .label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}

#meter{grid-area:meter;align-self:end;padding:10px 14px;display:flex;gap:18px;align-items:flex-end}
#meter .v{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#meter .fare .v{font-size:24px;color:var(--amber-deep)}
#meter .spd .v{font-size:18px}
#meter .clk .v{font-size:18px;color:var(--muted)}
#meter .tariff{font-size:10px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;max-width:130px;line-height:1.6}

#mapWrap{grid-area:map;align-self:end;justify-self:end;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{width:132px;height:104px;border-radius:8px;display:block;background:#CBD5CE}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
.btn:hover{border-color:var(--amber);color:var(--amber-deep)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);color:#241505;border-color:var(--amber-deep)}
.btn.primary:hover{background:var(--amber-hot);color:#241505}
.btn[disabled]{opacity:.42;cursor:not-allowed;border-color:var(--line);color:var(--muted)}

#touch{display:none}
#touch .pad{width:72px;height:72px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:24px;font-weight:800;user-select:none;touch-action:none;
  box-shadow:0 4px 12px rgba(31,54,54,.18)}
#touch .pad.gas{background:var(--amber);border-color:var(--amber-deep);color:#241505}
#touch .pad.act{background:#FFB65A;color:#241505;transform:scale(.96)}
@media (pointer:coarse){
  #touch{display:flex;position:absolute;left:0;right:0;bottom:12px;z-index:6;
    justify-content:space-between;padding:0 12px;pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  .hud{padding-bottom:100px}
}

#veil{position:absolute;inset:0;background:rgba(29,52,52,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:5}
#veil[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(20,40,40,.28)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;margin:6px 0 18px;line-height:1.6}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}

.upg{display:flex;flex-direction:column;gap:8px}
.upg .it{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
  padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)}
.upg .nm{font-weight:800;font-size:14px}
.upg .ef{font-size:11px;color:var(--muted);grid-column:1}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:16px;height:5px;border-radius:2px;background:#E3EAE6;border:1px solid var(--line)}
.pips i.on{background:var(--amber);border-color:var(--amber-deep)}

.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.crew .c{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper-2);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.crew .c.on{border-color:var(--amber);background:#FFF3E0}
.crew .c.lock{opacity:.5}
.crew svg{width:56px;height:56px}
.crew .nm{font-family:var(--display);font-weight:600;font-size:13px}
.crew .pk{font-size:11px;color:var(--amber-deep);line-height:1.45;font-weight:600}
.crew .lk{font-size:11px;color:var(--muted)}
.crew button{margin-top:auto;width:100%;padding:6px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:12px;font-weight:700}

.tally{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tally .tr{display:flex;justify-content:space-between;gap:14px;padding:9px 13px;background:var(--paper-2);font-size:13px}
.tally .tr b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.tally .tr.hi{background:#FFF3E0}
.tally .tr.hi b{color:var(--amber-deep)}

.hero{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.hero svg{width:88px;height:88px;flex:none}

#toast{position:absolute;left:50%;top:98px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:var(--paper);border:1px solid var(--amber);border-radius:12px;padding:9px 16px;font-size:13px;
  font-weight:800;color:var(--amber-deep);animation:pop .3s ease-out;white-space:nowrap;box-shadow:0 8px 22px rgba(31,54,54,.18)}
.tst small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;font-family:var(--mono)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.keys{font-size:12px;color:var(--muted);line-height:1.9}
.keys kbd{font-family:var(--mono);font-size:11px;background:var(--paper-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink)}

@media (max-width:720px){
  .hud{padding:9px;gap:8px;grid-template-areas:"driver order order" "purse . ." "meter touch map"}
  #orderCard{min-width:0;width:100%;padding:8px 11px 10px}
  #orderCard .goal{font-size:13px}
  #purse{justify-self:start;text-align:left;min-width:0;padding:7px 11px}
  #purse .row{justify-content:flex-start}
  #driverChip .pk{display:none}
  #mini{width:96px;height:76px}
  #meter .tariff{display:none}
  #meter .clk{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div id="driverChip"><span id="chipAv"></span><span><span class="nm" id="chipName">Мартын</span><br><span class="pk" id="chipPerk"></span></span></div>

    <div id="orderCard" class="plate">
      <div class="goal" id="goalText">Смена не начата</div>
      <div class="addr"><span id="addrText">Хвостоград, парк такси</span><span class="dist" id="distText">—</span></div>
      <div class="bar" id="patBar"><i style="width:100%"></i></div>
    </div>

    <div id="heatChip" hidden><span class="siren"></span><span class="txt" id="heatText">Патруль на хвосте</span><span class="hbar"><i id="heatBar"></i></span></div>

    <div id="purse" class="plate">
      <div class="money"><span id="moneyText">0</span> ж</div>
      <div class="row"><span>★ <b id="ratingText">5.00</b></span><span>заказов <b id="ordersText">0</b></span><span>срыв <b id="failsText">0</b></span></div>
      <div id="nextUp">
        <div class="label"><span>новый водитель</span><span id="nextUpN">через 10</span></div>
        <div class="bar"><i id="nextUpBar" style="width:0%"></i></div>
      </div>
    </div>

    <div id="meter" class="plate">
      <div class="fare"><div class="label">счётчик</div><div class="v"><span id="fareText">0</span> ж</div></div>
      <div class="spd"><div class="label">скорость</div><div class="v"><span id="speedText">0</span> км/ч</div></div>
      <div class="clk"><div class="label">время</div><div class="v" id="clockText">11:00</div></div>
      <div class="tariff">посадка 20 ж<br>тариф 24 ж / 100 м</div>
    </div>

    <div id="touch">
      <div class="grp"><div class="pad" data-k="left">◀</div><div class="pad" data-k="right">▶</div></div>
      <div class="grp"><div class="pad" data-k="brake">▼</div><div class="pad gas" data-k="gas">▲</div></div>
    </div>

    <div id="mapWrap" class="plate">
      <canvas id="mini" width="264" height="208"></canvas>
      <div class="btns">
        <button class="btn" id="btnView">Вид</button>
        <button class="btn" id="btnGarage">Гараж</button>
        <button class="btn" id="btnCrew">Парк</button>
        <button class="btn" id="btnSound">Звук</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="veil"><div class="sheet" id="sheet"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ---------- Хвостоград: мир ---------- */
const ROAD = 72, BLOCK = 200, CELL = ROAD + BLOCK, GW = 10, GH = 8;
const WW = GW * CELL + ROAD, WH = GH * CELL + ROAD;
const M_PER_PX = 0.25;
const BOARD = 20, PER_M = 0.24;
const CURB = 2.6;                                   // высота тротуара

const STREET_V = ["пр. Копытный","ул. Клыковая","ул. Пуховая","бул. Усатый","ул. Чешуйчатая","пер. Гнёздный","ул. Рогатая","пр. Плавниковый","ул. Ушастая","ул. Мшистая","ш. Косматое"];
const STREET_H = ["наб. Норная","ул. Хвостатая","пер. Лапчатый","бул. Гривистый","ул. Когтевая","ш. Берложье","ул. Крылатая","пер. Копошный","ул. Полосатая"];

const CREW = [
  {id:"monkey", name:"Мартын", kind:"обезьяна", at:0,  fur:"#8A6246", fur2:"#E0B189", ear:"round", nose:"#3B2A20",
   perk:"Цепкие лапы: +15% к управлению", mod:{turn:1.15}},
  {id:"racoon", name:"Гоша", kind:"енот", at:10, fur:"#8B98A1", fur2:"#E6ECEF", ear:"point", nose:"#2A3238", mask:true,
   perk:"Обаятельный жулик: +35% чаевых", mod:{tips:1.35}},
  {id:"cheetah",name:"Спринт", kind:"гепард", at:20, fur:"#E0AE4C", fur2:"#F6E7BE", ear:"round", nose:"#3B2A20", spots:true,
   perk:"Разгон саванны: +20% скорости", mod:{speed:1.2}},
  {id:"owl",    name:"Уля", kind:"сова", at:30, fur:"#B08C63", fur2:"#EFDDC2", ear:"tuft", nose:"#E8A33D",
   perk:"Зоркий глаз: пассажиры ждут на 40% дольше", mod:{patience:1.4}},
  {id:"fox",    name:"Рыж", kind:"лис", at:40, fur:"#DD7A32", fur2:"#F8ECE0", ear:"point", nose:"#2A2220",
   perk:"Свой тариф: +20% к оплате", mod:{fare:1.2}},
  {id:"turtle", name:"Тиша", kind:"черепаха", at:50, fur:"#6A9862", fur2:"#D3E2B4", ear:"tiny", nose:"#2F3B2C", shell:true,
   perk:"Панцирь: удары не сбрасывают скорость и рейтинг", mod:{armor:1}}
];

const UPGRADES = [
  {id:"motor", name:"Мотор", ef:l=>`макс. скорость +${l*8}%`, base:90},
  {id:"boost", name:"Разгон", ef:l=>`ускорение +${l*12}%`, base:80},
  {id:"tyres", name:"Резина", ef:l=>`поворотливость +${l*10}%`, base:75},
  {id:"meterUp", name:"Счётчик", ef:l=>`тариф +${l*10}%`, base:120},
  {id:"charm", name:"Обаяние", ef:l=>`чаевые +${l*20}%`, base:100}
];
const MAXLVL = 6;
const cost = (u,l)=> Math.round(u.base * Math.pow(1.75,l) / 5) * 5;

const S = {
  money:0, orders:0, rating:5, driver:0, unlocked:1,
  up:{motor:0,boost:0,tyres:0,meterUp:0,charm:0},
  started:false, paused:true, order:null, lastBump:-9,
  fails:0, shiftMoney:0, shiftOrders:0, shiftFails:0,
  record:{money:0, orders:0}, muted:false
};
const SAVE = "hvostograd-taxi-3d-v1";
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify({money:S.money,orders:S.orders,rating:S.rating,driver:S.driver,
  unlocked:S.unlocked,up:S.up,fails:S.fails,record:S.record,muted:S.muted})); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE); if(!r) return; const d=JSON.parse(r);
  if(d && typeof d.money==="number"){ S.money=d.money; S.orders=d.orders|0; S.rating=d.rating||5;
    S.unlocked=Math.max(1,Math.min(d.unlocked|0||1,CREW.length));
    S.driver=Math.max(0,Math.min(d.driver|0,S.unlocked-1)); Object.assign(S.up,d.up||{});
    S.fails=d.fails|0; S.muted=!!d.muted;
    if(d.record && typeof d.record.money==="number") S.record={money:d.record.money|0, orders:d.record.orders|0}; } }catch(e){} }
load();

/* ---------- генерация города ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20260904);
const R = (a,b)=> a + rnd()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+1));

const FACADE = ["#EDE1CC","#DCC7A9","#E6D2B8","#D2C4B2","#F0E6D6","#D8CBB8","#C9BCA8"];
const ROOFC  = ["#C1583F","#CE7049","#B0604B","#A85F45","#8FA5A0"];
const blocks = [];
for(let gy=0; gy<GH; gy++){
  blocks[gy] = [];
  for(let gx=0; gx<GW; gx++){
    const ox = gx*CELL + ROAD, oy = gy*CELL + ROAD;
    const park = rnd() < 0.15;
    const b = {ox, oy, park, buildings:[], trees:[]};
    if(park){
      for(let i=0;i<RI(8,13);i++) b.trees.push({x:ox+R(16,BLOCK-16), y:oy+R(16,BLOCK-16), r:R(9,15), h:R(26,46)});
    } else {
      const cols = RI(2,3), rows = RI(2,3), cw = BLOCK/cols, ch = BLOCK/rows;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(rnd()<0.12) continue;
        const m1=R(5,12), m2=R(5,12);
        const bx=ox+c*cw+m1, by=oy+r*ch+m1, bw=cw-m1-m2, bh=ch-m1-m2;
        if(bw<26||bh<26) continue;
        b.buildings.push({x:bx, y:by, w:bw, h:bh, ht:R(34,120),
          face:FACADE[RI(0,FACADE.length-1)], roof:ROOFC[RI(0,ROOFC.length-1)]});
      }
      if(rnd()<0.35) b.trees.push({x:ox+R(20,BLOCK-20), y:oy+R(20,BLOCK-20), r:R(8,12), h:R(24,34)});
    }
    blocks[gy][gx] = b;
  }
}

/* окна: маленькие коробочки, чуть выступающие из фасада — зажигаются ночью */
const WINDOWS = [];
for(let gy=0; gy<GH; gy++) for(let gx=0; gx<GW; gx++) for(const bd of blocks[gy][gx].buildings){
  const rows = Math.max(1, Math.floor((bd.ht - 14)/13));
  for(let k=0; k<10; k++){
    if(rnd() < 0.42) continue;
    const yy = CURB + 11 + Math.floor(rnd()*rows)*13;
    if(yy > CURB + bd.ht - 7) continue;
    const face = RI(0,3);
    if(face === 0) WINDOWS.push({sx:0.8, sy:4.4, sz:5.2, x:bd.x+bd.w+0.3, y:yy, z:bd.y + R(7, bd.h-7)});
    else if(face === 1) WINDOWS.push({sx:0.8, sy:4.4, sz:5.2, x:bd.x-0.3, y:yy, z:bd.y + R(7, bd.h-7)});
    else if(face === 2) WINDOWS.push({sx:5.2, sy:4.4, sz:0.8, x:bd.x + R(7, bd.w-7), y:yy, z:bd.y+bd.h+0.3});
    else WINDOWS.push({sx:5.2, sy:4.4, sz:0.8, x:bd.x + R(7, bd.w-7), y:yy, z:bd.y-0.3});
  }
}

function blockAt(x,y){
  const gx = Math.floor(x/CELL), gy = Math.floor(y/CELL);
  if(gx<0||gy<0||gx>=GW||gy>=GH) return null;
  if(x - gx*CELL - ROAD < 0 || y - gy*CELL - ROAD < 0) return null;
  return blocks[gy][gx];
}
function solid(x,y){
  if(x<8||y<8||x>WW-8||y>WH-8) return true;
  const b = blockAt(x,y);
  if(!b || b.park) return false;
  for(const bd of b.buildings) if(x>bd.x&&x<bd.x+bd.w&&y>bd.y&&y<bd.y+bd.h) return true;
  return false;
}

/* ---------- машина ---------- */
const car = {x: ROAD/2, y: CELL + ROAD/2, a: 0, sp: 0, roll: 0};
function stats(){
  const d = CREW[S.driver].mod, u = S.up;
  return {
    max:   118 * (1 + u.motor*0.08) * (d.speed||1),
    acc:    95 * (1 + u.boost*0.12) * (d.speed||1),
    turn:  2.5 * (1 + u.tyres*0.10) * (d.turn||1),
    fare:  (1 + u.meterUp*0.10) * (d.fare||1),
    tips:  (1 + u.charm*0.20) * (d.tips||1),
    patience: (d.patience||1),
    armor: !!d.armor
  };
}

/* ---------- трафик, светофоры, патруль ---------- */
const traffic = [], cops = [];
const CIV = [["#5B8DBE","#3C6690"],["#7FA05F","#5C7A44"],["#DCD6C8","#B3AC9C"],["#A6604F","#7C4638"],["#5C6771","#3F4850"],["#C9A227","#997A18"],["#8E7BA6","#6A5A80"]];
const LIGHT_T = 9;
let clock = 0, heat = 0, lastViol = -9, lastHit = -9, lastCross = "", stuckT = 0;
const greenAxis = ()=> Math.floor(clock/LIGHT_T) % 2 === 0 ? "v" : "h";
const amberNow  = ()=> (clock % LIGHT_T) > LIGHT_T - 1.6;

const roadX = i => i*CELL + ROAD/2, roadY = j => j*CELL + ROAD/2;
const nearI = x => Math.max(0, Math.min(GW, Math.round((x - ROAD/2)/CELL)));
const nearJ = y => Math.max(0, Math.min(GH, Math.round((y - ROAD/2)/CELL)));

const MAX_TRAFFIC = 22;
function spawnTraffic(){
  const vert = Math.random() < 0.5;
  let x, y, dx, dy;
  if(vert){
    const i = nearI(car.x + (Math.random()-0.5)*820);
    dx = 0; dy = Math.random() < 0.5 ? 1 : -1;
    x = roadX(i); y = car.y - dy*(520 + Math.random()*300);
  } else {
    const j = nearJ(car.y + (Math.random()-0.5)*820);
    dy = 0; dx = Math.random() < 0.5 ? 1 : -1;
    y = roadY(j); x = car.x - dx*(520 + Math.random()*300);
  }
  x += -dy*17; y += dx*17;
  if(x < 24 || y < 24 || x > WW-24 || y > WH-24) return;
  for(const t of traffic) if(Math.abs(t.x-x) < 46 && Math.abs(t.y-y) < 46) return;
  const col = CIV[Math.floor(Math.random()*CIV.length)];
  traffic.push({x, y, dx, dy, sp:0, tsp:40 + Math.random()*30, col, mesh:takeCarMesh(col)});
}
function stopLine(v){
  if(v.dx){ const k = v.dx>0 ? Math.ceil((v.x-ROAD/2)/CELL) : Math.floor((v.x-ROAD/2)/CELL);
            return (k*CELL + ROAD/2 - v.x)*v.dx - ROAD/2; }
  const k = v.dy>0 ? Math.ceil((v.y-ROAD/2)/CELL) : Math.floor((v.y-ROAD/2)/CELL);
  return (k*CELL + ROAD/2 - v.y)*v.dy - ROAD/2;
}
function gapAhead(v, x, y, reach){
  const rel = (x-v.x)*v.dx + (y-v.y)*v.dy, side = Math.abs((x-v.x)*v.dy - (y-v.y)*v.dx);
  return (rel > 0 && rel < reach && side < 15) ? rel : Infinity;
}
function updateTraffic(dt){
  let tries = 0;
  while(traffic.length < MAX_TRAFFIC && tries++ < 5) spawnTraffic();
  const g = greenAxis();
  for(let i=traffic.length-1; i>=0; i--){
    const v = traffic[i];
    if(Math.hypot(v.x-car.x, v.y-car.y) > 1150 || v.x<12 || v.y<12 || v.x>WW-12 || v.y>WH-12){
      freeCarMesh(v.mesh); traffic.splice(i,1); continue;
    }
    let want = v.tsp, gap = Infinity;
    for(const o of traffic){ if(o !== v && o.dx === v.dx && o.dy === v.dy) gap = Math.min(gap, gapAhead(v, o.x, o.y, 66)); }
    gap = Math.min(gap, gapAhead(v, car.x, car.y, 62));
    for(const c of cops) gap = Math.min(gap, gapAhead(v, c.x, c.y, 62));
    if(gap < Infinity) want = Math.min(want, Math.max(0, (gap-27)*1.7));
    if((v.dx ? "h" : "v") !== g && !amberNow()){
      const d = stopLine(v);
      if(d > 0 && d < 48) want = Math.min(want, Math.max(0, (d-9)*1.5));
    }
    v.sp += (want - v.sp) * Math.min(1, dt*2.8);
    v.x += v.dx*v.sp*dt; v.y += v.dy*v.sp*dt;
  }
}
function spawnCop(){
  const an = Math.random()*6.283;
  let x = car.x + Math.cos(an)*620, y = car.y + Math.sin(an)*620;
  x = Math.max(ROAD/2, Math.min(WW-ROAD/2, x)); y = Math.max(ROAD/2, Math.min(WH-ROAD/2, y));
  if(Math.random() < 0.5) x = roadX(nearI(x)); else y = roadY(nearJ(y));
  const c = {x, y, a:Math.random()*6.283, sp:0, mesh:makeCopMesh()};
  scene.add(c.mesh); cops.push(c);
}
function clearCops(){ for(const c of cops) scene.remove(c.mesh); cops.length = 0; }
function updateCops(dt){
  const goalX = roadX(nearI(car.x));
  for(const c of cops){
    const myX = roadX(nearI(c.x)), myY = roadY(nearJ(c.y));
    const onH = Math.abs(c.y-myY) < ROAD*0.5, onV = Math.abs(c.x-myX) < ROAD*0.5;
    let tx, ty;
    if(Math.abs(c.x - goalX) > 10 && !(onV && Math.abs(myX-goalX) < 1)){
      if(onH){ tx = goalX; ty = myY; } else { tx = myX; ty = myY; }
    } else { tx = goalX; ty = car.y; }
    if(Math.hypot(car.x-c.x, car.y-c.y) < 150){ tx = car.x; ty = car.y; }

    const want = Math.atan2(ty-c.y, tx-c.x);
    let da = ((want - c.a + Math.PI*3) % (Math.PI*2)) - Math.PI;
    c.a += Math.max(-4.2*dt, Math.min(4.2*dt, da*4));
    const top = 128 + Math.min(30, heat*0.25);
    c.sp += ((Math.abs(da) > 1.2 ? top*0.45 : top) - c.sp) * dt*1.8;

    const nx = c.x + Math.cos(c.a)*c.sp*dt, ny = c.y + Math.sin(c.a)*c.sp*dt;
    let stuck = 0;
    if(!solid(nx, c.y)) c.x = nx; else stuck++;
    if(!solid(c.x, ny)) c.y = ny; else stuck++;
    if(stuck){ c.sp *= 0.5; c.a += 0.9*dt; }

    if(Math.hypot(car.x-c.x, car.y-c.y) < 25) ticket();
  }
}
function addHeat(n, why, sub){
  const was = heat;
  heat = Math.min(120, heat + n); lastViol = clock;
  if(why && clock - lastHit > 1.1){ lastHit = clock; toast(why, sub); }
  if(was < 50 && heat >= 50 && !cops.length){ spawnCop(); toast("Патруль засёк", "уходите от погони или получите штраф"); }
  if(heat >= 100 && cops.length < 2) spawnCop();
}
function ticket(){
  const fine = Math.max(30, Math.round(S.money*0.12));
  S.money = Math.max(0, S.money - fine);
  S.rating = Math.max(1, S.rating - 0.25);
  heat = 0; clearCops(); car.sp *= 0.15;
  toast(`Штраф −${fine.toLocaleString("ru-RU")} ж`, "патруль отпустил · рейтинг −0,25");
  sfx("ticket"); shake = 2.2;
  save(); paintHUD(); ratingCheck();
}

function roadPoint(){

    const i = RI(0,GW), gy = RI(0,GH-1);
    return {x: i*CELL + ROAD/2 + R(-14,14), y: gy*CELL + ROAD + R(24, BLOCK-24),
      street: STREET_V[i], house: gy*20 + (i%2 ? RI(1,9)*2-1 : RI(1,9)*2)};
  }
  const j = RI(0,GH), gx = RI(0,GW-1);                        // поперечная
  return {x: gx*CELL + ROAD + R(24, BLOCK-24), y: j*CELL + ROAD/2 + R(-14,14),
    street: STREET_H[j], house: gx*20 + (j%2 ? RI(1,9)*2-1 : RI(1,9)*2)};
}
const PASSENGERS = ["барсук","выдра","хорёк","бобр","ёж","як","тапир","лемур","альпака","пингвин","сурок","лань"];
function newOrder(){
  let a = roadPoint(), g1 = 0;
  while(Math.hypot(a.x-car.x, a.y-car.y) > 950 && g1++ < 40) a = roadPoint();   // подача — в своём районе
  let b = roadPoint(), g2 = 0;
  while(Math.hypot(a.x-b.x, a.y-b.y) < 700 && g2++ < 40) b = roadPoint();
  S.order = {phase:"pickup", from:a, to:b, who:PASSENGERS[RI(0,PASSENGERS.length-1)],
    fur:PAX_FUR[RI(0,PAX_FUR.length-1)], ridden:0, crashes:0, late:0, patience:1, patMax:1};
  setPatience();
  paintOrder();
}
/* запас времени — по кварталам, которые ещё предстоит намотать, а не по длине поездки */
function setPatience(){
  const o = S.order;
  const d = o.phase === "pickup" ? Math.hypot(car.x-o.from.x, car.y-o.from.y)
                                 : Math.hypot(o.from.x-o.to.x, o.from.y-o.to.y);
  o.patMax = (18 + d/40) * stats().patience;
  o.patience = o.patMax;
  o.late = 0;
}
function target(){ return S.order ? (S.order.phase==="pickup" ? S.order.from : S.order.to) : null; }

  if(a.ear==="point") ears = `<path d="M${c-hr*0.92} ${c-hr*0.5} L${c-hr*0.72} ${c-hr*1.42} L${c-hr*0.18} ${c-hr*0.92} Z" fill="${a.fur}"/>
    <path d="M${c+hr*0.92} ${c-hr*0.5} L${c+hr*0.72} ${c-hr*1.42} L${c+hr*0.18} ${c-hr*0.92} Z" fill="${a.fur}"/>`;

    <path d="M${c+hr*0.8} ${c-hr*0.6} L${c+hr*0.98} ${c-hr*1.3} L${c+hr*0.3} ${c-hr*0.95} Z" fill="${a.fur}"/>`;
  if(a.ear==="tiny") ears = `<circle cx="${c-hr*0.9}" cy="${c-hr*0.3}" r="${hr*0.16}" fill="${a.fur}"/><circle cx="${c+hr*0.9}" cy="${c-hr*0.3}" r="${hr*0.16}" fill="${a.fur}"/>`;
  const mask = a.mask ? `<path d="M${c-hr*0.82} ${c-hr*0.12} q${hr*0.82} ${hr*0.42} ${hr*1.64} 0 q-${hr*0.3} ${hr*0.5} -${hr*0.82} ${hr*0.5} q-${hr*0.52} 0 -${hr*0.82} -${hr*0.5} Z" fill="#3A464E" opacity=".8"/>` : "";

/* ---------- звук ---------- */
const SND = {ctx:null, on:!S.muted};
function audioBoot(){
  if(SND.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  let ctx; try{ ctx = new AC(); }catch(e){ return; }
  if(ctx.state === "suspended") ctx.resume().catch(()=>{});
  const master = ctx.createGain(); master.gain.value = SND.on ? 0.5 : 0; master.connect(ctx.destination);

  const eg = ctx.createGain(); eg.gain.value = 0;               // мотор
  const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 640; flt.Q.value = 3.5;
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.type = "sawtooth"; o2.type = "square"; o2.detune.value = -16;
  o1.frequency.value = 52; o2.frequency.value = 26;
  o1.connect(eg); o2.connect(eg); eg.connect(flt); flt.connect(master);
  o1.start(); o2.start();

  const sg = ctx.createGain(); sg.gain.value = 0;               // сирена
  const so = ctx.createOscillator(); so.type = "square"; so.frequency.value = 640;
  so.connect(sg); sg.connect(master); so.start();

  Object.assign(SND, {ctx, master, eg, flt, o1, o2, sg, so});
}
function blip(freq, dur, type, vol, when){
  if(!SND.ctx) return;
  const t = SND.ctx.currentTime + (when || 0);
  const o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.22, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, freq, vol){
  if(!SND.ctx) return;
  const ctx = SND.ctx, n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.1;
  const g = ctx.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(SND.master); src.start();
}
function sfx(kind){
  if(!SND.ctx || !SND.on) return;
  if(kind === "coin")   [660,880,1100,1320].forEach((f,i)=> blip(f, 0.16, "triangle", 0.2, i*0.055));
  if(kind === "level")  [523,659,784,1046,1318].forEach((f,i)=> blip(f, 0.26, "triangle", 0.22, i*0.09));
  if(kind === "crash"){ noiseBurst(0.34, 190, 0.5); blip(88, 0.22, "square", 0.26); }
  if(kind === "bump")   noiseBurst(0.14, 320, 0.24);
  if(kind === "fail"){  blip(330, 0.16, "sawtooth", 0.18); blip(196, 0.34, "sawtooth", 0.18, 0.15); }
  if(kind === "ticket"){ blip(880, 0.14, "square", 0.2); blip(587, 0.14, "square", 0.2, 0.16); blip(392, 0.4, "square", 0.2, 0.32); }
  if(kind === "ui")     blip(720, 0.08, "triangle", 0.14);
}
function audioFrame(){
  if(!SND.ctx) return;
  if(SND.ctx.state === "suspended" && S.started) SND.ctx.resume().catch(()=>{});
  const t = SND.ctx.currentTime, sp = Math.abs(car.sp), thr = keys.gas ? 1 : 0;
  const f = 46 + sp*1.3 + thr*18;
  SND.o1.frequency.setTargetAtTime(f, t, 0.06);
  SND.o2.frequency.setTargetAtTime(f*0.5, t, 0.06);
  SND.flt.frequency.setTargetAtTime(400 + sp*7 + thr*280, t, 0.08);
  SND.eg.gain.setTargetAtTime((S.started && !S.paused) ? 0.03 + thr*0.045 + Math.min(0.045, sp/2600) : 0, t, 0.12);
  let near = 1e9;
  for(const c of cops) near = Math.min(near, Math.hypot(c.x-car.x, c.y-car.y));
  SND.sg.gain.setTargetAtTime((cops.length && !S.paused) ? 0.15*(1 - Math.min(1, near/640)) : 0, t, 0.15);
  SND.so.frequency.setTargetAtTime(Math.floor(clock*2.4)%2 ? 900 : 620, t, 0.02);
}
function toggleSound(){
  S.muted = !S.muted; SND.on = !S.muted; audioBoot();
  if(SND.master) SND.master.gain.setTargetAtTime(SND.on ? 0.5 : 0, SND.ctx.currentTime, 0.05);
  const b = document.getElementById("btnSound"); if(b) b.textContent = SND.on ? "Звук" : "Тихо";
  if(SND.on) sfx("ui");
  save();
}

function groundTexture(){
  const K = 0.55, c = document.createElement("canvas");
  c.width = Math.round(WW*K); c.height = Math.round(WH*K);
  const g = c.getContext("2d");
  g.scale(K, K);
  g.fillStyle = "#8E9A9B"; g.fillRect(0, 0, WW, WH);
  for(let gy=0; gy<GH; gy++) for(let gx=0; gx<GW; gx++){
    const b = blocks[gy][gx];
    g.fillStyle = b.park ? "#7FB964" : "#BDC3BA";
    g.fillRect(b.ox-8, b.oy-8, BLOCK+16, BLOCK+16);
  }
  g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 3; g.setLineDash([16,18]);
  g.beginPath();
  for(let i=0;i<=GW;i++){ g.moveTo(roadX(i), 0); g.lineTo(roadX(i), WH); }
  for(let j=0;j<=GH;j++){ g.moveTo(0, roadY(j)); g.lineTo(WW, roadY(j)); }
  g.stroke(); g.setLineDash([]);
  g.fillStyle = "rgba(255,255,255,.8)";
  for(let i=0;i<=GW;i++) for(let j=0;j<=GH;j++){
    const cx = roadX(i), cy = roadY(j), r = ROAD/2;
    for(let k=0;k<5;k++){
      g.fillRect(cx+r+3, cy-r+4+k*13, 9, 7);
      g.fillRect(cx-r-12, cy-r+4+k*13, 9, 7);
      g.fillRect(cx-r+4+k*13, cy+r+3, 7, 9);
      g.fillRect(cx-r+4+k*13, cy-r-12, 7, 9);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* одна InstancedMesh на цвет — надёжнее, чем per-instance цвета, и всё те же единицы вызовов */
function instanced(geo, items, colorOf, place, opts){
  const groups = new Map(), m = new THREE.Matrix4(), out = [];
  for(const it of items){
    const c = colorOf(it);
    if(!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  }
  groups.forEach((list, c)=>{
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({color:c}), list.length);
    list.forEach((it, i)=>{ place(it, m); mesh.setMatrixAt(i, m); });

    if(opts && opts.cast) mesh.castShadow = true;
    if(opts && opts.receive) mesh.receiveShadow = true;
    scene.add(mesh); out.push(mesh);
  });
  return out;
}

let nightF = 0, dayT = 0;
const cA = new THREE.Color(), cB = new THREE.Color();
const lerpN = (a,b,k)=> a + (b-a)*k;
function updateSky(){
  dayT = (clock/DAYLEN) % 1;
  let i = 0; while(i < PHASES.length-2 && dayT >= PHASES[i+1].t) i++;
  const a = PHASES[i], b = PHASES[i+1], k = Math.min(1, Math.max(0, (dayT - a.t)/(b.t - a.t)));
  cA.set(a.sky); cB.set(b.sky);
  scene.background.copy(cA).lerp(cB, k);
  scene.fog.color.copy(scene.background);
  scene.fog.near = lerpN(a.near, b.near, k); scene.fog.far = lerpN(a.far, b.far, k);
  cA.set(a.sun); cB.set(b.sun); sun.color.copy(cA).lerp(cB, k);
  sun.intensity = lerpN(a.si, b.si, k);
  cA.set(a.hs); cB.set(b.hs); hemi.color.copy(cA).lerp(cB, k);
  cA.set(a.hg); cB.set(b.hg); hemi.groundColor.copy(cA).lerp(cB, k);
  hemi.intensity = lerpN(a.hi, b.hi, k);
  const ang = dayT*Math.PI*2 + 2.3;
  SUN_OFF.set(Math.cos(ang)*245, lerpN(a.el, b.el, k), Math.sin(ang)*245);
  nightF = lerpN(a.night, b.night, k);
  const dark = nightF > 0.3;
  winMesh.visible = dark; lampGlow.visible = dark;
  if(taxi) for(const o of taxi.userData.night) o.visible = dark;
}

function makeHead(a){
  const g = new THREE.Group();
  const fur  = new THREE.MeshLambertMaterial({color:a.fur});
  const fur2 = new THREE.MeshLambertMaterial({color:a.fur2});
  const dark = new THREE.MeshLambertMaterial({color:"#1B282C"});
  const nose = new THREE.MeshLambertMaterial({color:a.nose});
  const owl  = a.ear === "tuft";

  const head = bit(SPH, fur, 3.6, 3.6, 3.6, 0, 0, 0);
  head.castShadow = true; g.add(head);

  if(a.shell) g.add(bit(SPH, new THREE.MeshLambertMaterial({color:"#4E8050"}), 3.4, 2.2, 3.8, -3.4, -1.8, 0));
  if(a.mask)  g.add(bit(BOXG, new THREE.MeshLambertMaterial({color:"#3A464E"}), 1.4, 1.7, 6.6, 2.2, 0.7, 0));
  if(a.spots) for(let i=0;i<6;i++){
    const an = i/6*6.283 + 0.6;
    g.add(bit(SPH, new THREE.MeshLambertMaterial({color:"#6B4C22"}), 0.5, 0.5, 0.5,
      Math.cos(an)*1.6, Math.sin(an)*2.2 + 0.4, Math.cos(an*1.7)*3.2));
  }

  g.add(bit(SPH, fur2, 1.8, 1.5, 2.0, 2.6, -0.8, 0));                       // морда
  g.add(bit(owl ? CONE : SPH, nose, owl ? 0.9 : 0.7, owl ? 1.6 : 0.6, 0.9,  // нос или клюв
    owl ? 3.6 : 4.1, owl ? -0.9 : -0.6, 0));
  if(owl) g.children[g.children.length-1].rotation.z = -Math.PI/2;

  for(const z of [-1.6, 1.6]){
    if(owl) g.add(bit(SPH, fur2, 0.9, 1.5, 1.5, 2.3, 0.7, z));              // белые круги вокруг глаз
    const e = bit(SPH, dark, owl ? 0.8 : 0.6, owl ? 1.1 : 0.72, owl ? 1.1 : 0.62, owl ? 2.9 : 2.7, 0.9, z);
    g.add(e);
    g.add(bit(SPH, new THREE.MeshLambertMaterial({color:"#FFFFFF"}), 0.28, 0.28, 0.28, 3.3, 1.5, z + 0.3));
  }

  if(a.ear === "round") for(const z of [-3.1, 3.1]){
    g.add(bit(SPH, fur, 1.5, 1.5, 0.9, 0, 1.9, z));
    g.add(bit(SPH, fur2, 0.9, 0.9, 0.6, 0, 1.9, z*1.18));
  }
  if(a.ear === "point") for(const z of [-2.1, 2.1]){
    const e = bit(CONE, fur, 1.3, 3.4, 1.3, 0, 4.0, z);
    e.rotation.x = z > 0 ? 0.3 : -0.3; g.add(e);
  }
  if(a.ear === "tuft") for(const z of [-1.9, 1.9]){
    const e = bit(CONE, fur, 1.0, 2.6, 1.0, 0.3, 3.8, z);
    e.rotation.x = z > 0 ? 0.45 : -0.45; g.add(e);
  }
  if(a.ear === "tiny") for(const z of [-3.3, 3.3]) g.add(bit(SPH, fur, 0.8, 0.8, 0.6, 0, 1.2, z));

  g.userData.fur = fur; g.userData.fur2 = fur2;
  return g;
}

const PED_N = 20;

const peds = [];
let lastPed = -9;
function makePed(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(CYL, new THREE.MeshLambertMaterial({color:"#6E7F96"}));
  body.scale.set(2.4, 8.4, 2.4); body.position.y = 4.2; body.castShadow = true;

function pedSpot(p){
  const gx = Math.max(0, Math.min(GW-1, nearI(car.x) + (Math.random()*5|0) - 2));
  const gy = Math.max(0, Math.min(GH-1, nearJ(car.y) + (Math.random()*5|0) - 2));
  p.b = blocks[gy][gx];
  p.t = Math.random();
  p.sp = (0.030 + Math.random()*0.022) * (Math.random() < 0.5 ? -1 : 1);
  p.ph = Math.random()*6.283; p.scared = 0;
  p.mesh.userData.body.color.set(COATS[Math.random()*COATS.length|0]);
  p.mesh.userData.head.color.set(PELTS[Math.random()*PELTS.length|0]);
}
function pedPos(p){
  const W = BLOCK + 10, x0 = p.b.ox - 5, y0 = p.b.oy - 5;
  const u = (((p.t % 1) + 1) % 1) * 4, k = u | 0, f = u - k;
  if(k === 0) return [x0 + f*W, y0, 0];
  if(k === 1) return [x0 + W, y0 + f*W, 1];
  if(k === 2) return [x0 + (1-f)*W, y0 + W, 2];
  return [x0, y0 + (1-f)*W, 3];
}
for(let i=0;i<PED_N;i++){
  const p = {mesh:makePed()};
  scene.add(p.mesh); peds.push(p); pedSpot(p);
}
function hitPed(p){
  if(clock - lastPed < 1.4) return;
  lastPed = clock;
  S.rating = Math.max(1, S.rating*0.88 + 1.2*0.12);
  addHeat(45, "Наезд на тротуаре", "пешеход цел, но патруль в ярости");
  sfx("crash"); shake = 3.4; p.scared = 2.2;
  save(); paintHUD(); ratingCheck();
}
function updatePeds(dt){
  for(const p of peds){
    p.t += p.sp*dt*(p.scared > 0 ? 2.8 : 1);
    const pos = pedPos(p), x = pos[0], y = pos[1];
    if(Math.hypot(x-car.x, y-car.y) > 720){ pedSpot(p); continue; }
    p.scared = Math.max(0, p.scared - dt);
    const d = Math.hypot(x-car.x, y-car.y);
    if(d < 36 && Math.abs(car.sp) > 34) p.scared = Math.max(p.scared, 1.1);
    if(d < 10 && Math.abs(car.sp) > 42) hitPed(p);
    p.mesh.position.set(x, CURB, y);
    p.mesh.rotation.y = -(pos[2]*Math.PI/2 + (p.sp < 0 ? Math.PI : 0));
    const gait = Math.sin(clock*(p.scared > 0 ? 17 : 8) + p.ph);
    p.mesh.children[0].position.y = 4.2 + Math.abs(gait)*0.7;
    p.mesh.children[1].position.y = 10 + Math.abs(gait)*0.7;
    p.mesh.rotation.z = gait*0.05;
  }
}

const COINS = 24;
const coinMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(2.6, 2.6, 0.7, 10),
  new THREE.MeshLambertMaterial({color:"#F2B63C"}), COINS);
coinMesh.count = 0; scene.add(coinMesh);
const coinData = [];
function coins(){
  coinData.length = 0;
  for(let i=0;i<COINS;i++) coinData.push({
    x:car.x, y:16, z:car.y,
    vx:(Math.random()-0.5)*70, vy:70+Math.random()*70, vz:(Math.random()-0.5)*70,
    a:Math.random()*6, l:1.2
  });
  coinMesh.count = COINS;
}
function updateCoins(dt){
  if(!coinMesh.count) return;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(1,1,1), p = new THREE.Vector3();
  let alive = 0;
  for(let i=0;i<coinData.length;i++){
    const c = coinData[i];
    c.l -= dt; if(c.l <= 0){ m.makeScale(0,0,0); coinMesh.setMatrixAt(i, m); continue; }
    alive++;
    c.vy -= 190*dt; c.a += dt*7;
    c.x += c.vx*dt; c.y += c.vy*dt; c.z += c.vz*dt;
    if(c.y < 3){ c.y = 3; c.vy *= -0.4; c.vx *= 0.7; c.vz *= 0.7; }
    e.set(c.a, c.a*0.6, 0); q.setFromEuler(e); p.set(c.x, c.y, c.z);
    m.compose(p, q, s); coinMesh.setMatrixAt(i, m);
  }
  coinMesh.instanceMatrix.needsUpdate = true;
  if(!alive) coinMesh.count = 0;
}

/* --- следы шин --- */
const SKIDS = 200;
const skidMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({color:"#2A3033", transparent:true, opacity:0.3, depthWrite:false}), SKIDS);
skidMesh.frustumCulled = false; scene.add(skidMesh);
const skidData = new Array(SKIDS).fill(null);
let skidI = 0, skidT = 0, shake = 0;
{
  const m = new THREE.Matrix4().makeScale(0,0,0);
  for(let i=0;i<SKIDS;i++) skidMesh.setMatrixAt(i, m);
  skidMesh.instanceMatrix.needsUpdate = true;
}
function skid(){
  const c = Math.cos(car.a), sn = Math.sin(car.a);
  for(const off of [-6.2, 6.2]){
    skidData[skidI] = {x: car.x - c*8 - sn*off, z: car.y - sn*8 + c*off, a: car.a, l: 3.2, max: 3.2};
    skidI = (skidI + 1) % SKIDS;
  }
}
const _sm = new THREE.Matrix4(), _sq = new THREE.Quaternion(), _se = new THREE.Euler(),
      _ss = new THREE.Vector3(), _sp = new THREE.Vector3();
function updateSkids(dt){
  let dirty = false;
  for(let i=0;i<SKIDS;i++){
    const d = skidData[i]; if(!d) continue;
    dirty = true; d.l -= dt;
    if(d.l <= 0){ skidData[i] = null; _sm.makeScale(0,0,0); skidMesh.setMatrixAt(i, _sm); continue; }
    _se.set(-Math.PI/2, -d.a, 0, "YXZ");
    _sq.setFromEuler(_se);
    _ss.set(10, 3.2*Math.min(1, d.l/d.max), 1);
    _sp.set(d.x, 0.34, d.z);
    _sm.compose(_sp, _sq, _ss);
    skidMesh.setMatrixAt(i, _sm);
  }
  if(dirty) skidMesh.instanceMatrix.needsUpdate = true;
}

/* --- камера и синхронизация --- */
const camPos = new THREE.Vector3(car.x, 60, car.y + 90);
const camAim = new THREE.Vector3(car.x, 8, car.y);
const tmp = new THREE.Vector3();
function syncScene(dt){
  taxi.position.set(car.x, 0, car.y);
  taxi.rotation.y = -car.a;
  taxi.rotation.z = car.roll;
  taxi.userData.pax.visible = !!(S.order && S.order.phase === "ride");
  if(driverHead) driverHead.rotation.y = -(car.steer||0)*0.4;

  for(const v of traffic){ v.mesh.position.set(v.x, 0, v.y); v.mesh.rotation.y = -Math.atan2(v.dy, v.dx); }
  const on = Math.floor(clock*6) % 2;
  for(const c of cops){
    c.mesh.position.set(c.x, 0, c.y); c.mesh.rotation.y = -c.a;
    c.mesh.userData.bar[0].color.set(on ? "#2F6FD0" : "#D24437");
    c.mesh.userData.bar[1].color.set(on ? "#D24437" : "#2F6FD0");
  }
  syncLights();
  updateSky();
  updateCoins(dt);
  updateSkids(dt);

  const tg = target();
  if(tg && S.started){
    const pickup = S.order.phase === "pickup", col = pickup ? "#2E8C56" : "#D24437";
    markerGroup.visible = true;
    markerGroup.position.set(tg.x, 0, tg.y);
    beamMat.color.set(col); ringMat.color.set(col); arrowMat.color.set(col);
    const pulse = 1 + Math.sin(clock*3)*0.12;
    ring.scale.set(pulse, pulse, 1);
    arrowPivot.visible = true;
    arrowPivot.position.set(car.x, 30 + Math.sin(clock*2.4)*1.6, car.y);
    arrowPivot.rotation.y = -Math.atan2(tg.y-car.y, tg.x-car.x);
  } else { markerGroup.visible = false; arrowPivot.visible = false; }

  // солнце едет за такси, чтобы тени были всегда рядом
  sun.position.set(car.x + SUN_OFF.x, SUN_OFF.y, car.y + SUN_OFF.z);
  sun.target.position.set(car.x, 0, car.y);
  sun.target.updateMatrixWorld();

  const ca = Math.cos(car.a), sa = Math.sin(car.a);
  const k = 1 - Math.exp(-dt*(viewMode === 0 ? 5.5 : viewMode === 1 ? 4 : 6.5));
  if(viewMode === 2){
    // портрет: камера перед капотом, смотрит на голову водителя
    const hx = car.x + 1.2*ca + 3.1*sa, hz = car.y + 1.2*sa - 3.1*ca;
    const sw = Math.sin(clock*0.4)*0.22;
    tmp.set(hx + Math.cos(car.a + sw)*27, 19.5, hz + Math.sin(car.a + sw)*27);
    camPos.lerp(tmp, k);
    tmp.set(hx, 15.4, hz);
    camAim.lerp(tmp, k);
  } else {
    const back = 62 + Math.abs(car.sp)*0.22, high = 30 + Math.abs(car.sp)*0.06;
    if(viewMode === 0) tmp.set(car.x - ca*back, high, car.y - sa*back);
    else               tmp.set(car.x - ca*40, 210, car.y - sa*40);
    camPos.lerp(tmp, k);
    tmp.set(car.x + ca*36, viewMode === 0 ? 9 : 0, car.y + sa*36);
    camAim.lerp(tmp, k);
  }
  camera.position.copy(camPos);
  camera.lookAt(camAim);

  const wantFov = viewMode === 1 ? 56 : viewMode === 2 ? 44 : 56 + Math.min(15, Math.abs(car.sp)*0.13);
  if(Math.abs(camera.fov - wantFov) > 0.04){
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt*3.2);
    camera.updateProjectionMatrix();
  }
  if(shake > 0.01){
    camera.position.x += (Math.random()-0.5)*shake;
    camera.position.y += (Math.random()-0.5)*shake;
    camera.position.z += (Math.random()-0.5)*shake;
    camera.rotation.z += (Math.random()-0.5)*shake*0.006;
    shake *= Math.exp(-dt*4.5);
  } else shake = 0;
}
function resize(){
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}

/* ---------- обновление ---------- */
function update(dt){
  clock += dt;
  const P = stats();
  if(keys.gas) car.sp += P.acc*dt;
  else if(keys.brake) car.sp -= (car.sp > 3 ? P.acc*1.9 : P.acc*1.1)*dt;
  car.sp *= (1 - 1.05*dt);
  car.sp = Math.max(-P.max*0.45, Math.min(P.max, car.sp));

  const grip = Math.min(1, Math.abs(car.sp)/34), dir = car.sp < 0 ? -1 : 1;
  let steer = 0;
  if(keys.left)  steer -= 1;
  if(keys.right) steer += 1;
  car.a += steer * P.turn*dt*grip*dir;
  car.roll += (steer * grip * -0.07 - car.roll) * Math.min(1, dt*6);
  car.steer = steer;
  skidT -= dt;
  if(skidT <= 0 && Math.abs(car.sp) > 52 && ((steer && grip > 0.85) || (keys.brake && car.sp > 62))){ skid(); skidT = 0.045; }

  const nx = car.x + Math.cos(car.a)*car.sp*dt, ny = car.y + Math.sin(car.a)*car.sp*dt;
  let blocked = 0;
  if(!hits(nx, car.y)) car.x = nx; else blocked++;
  if(!hits(car.x, ny)) car.y = ny; else blocked++;
  if(blocked && !P.armor){
    const now = performance.now()/1000;
    if(now - S.lastBump > 1 && Math.abs(car.sp) > 30){
      S.lastBump = now; if(S.order) S.order.crashes++;
      sfx("bump"); shake = Math.min(3, Math.abs(car.sp)*0.03);
    }
    car.sp *= 0.45;
  }
  if(blocked === 2){
    stuckT += dt;
    if(stuckT > 0.45){
      const ux = roadX(nearI(car.x)) - car.x, uy = roadY(nearJ(car.y)) - car.y, ul = Math.hypot(ux,uy) || 1;
      car.x += ux/ul*46*dt; car.y += uy/ul*46*dt; car.sp *= 0.5;
    }
  } else stuckT = 0;
  car.x = Math.max(10, Math.min(WW-10, car.x)); car.y = Math.max(10, Math.min(WH-10, car.y));

  updateTraffic(dt);
  updatePeds(dt);
  if(cops.length) updateCops(dt);

  for(const v of traffic){
    const ddx = v.x-car.x, ddy = v.y-car.y, d = Math.hypot(ddx, ddy) || 0.001;
    if(d < 22){
      const n = (22-d)/d;
      car.x -= ddx*n*0.6; car.y -= ddy*n*0.6;
      v.x += ddx*n*0.5; v.y += ddy*n*0.5; v.sp *= 0.5;
      const into = (Math.cos(car.a)*ddx + Math.sin(car.a)*ddy)/d;
      if((car.sp > 0 && into > 0.3) || (car.sp < 0 && into < -0.3)){
        const hard = Math.abs(car.sp) > 42;
        if(hard && clock - lastHit > 1.1 && S.order) S.order.crashes++;
        car.sp *= P.armor ? 0.75 : (hard ? -0.2 : 0.4);
        if(hard){ addHeat(30, "ДТП с попутной машиной", "патруль это заметил"); sfx("crash"); shake = 3.6; }
      }
    }
  }

  const ax = Math.abs(Math.cos(car.a)) > Math.abs(Math.sin(car.a)) ? "h" : "v";
  const ii = nearI(car.x), jj = nearJ(car.y), key = ii+":"+jj;
  if(Math.abs(car.x-roadX(ii)) < ROAD/2 && Math.abs(car.y-roadY(jj)) < ROAD/2){
    if(key !== lastCross && ax !== greenAxis() && !amberNow() && Math.abs(car.sp) > 55){
      lastCross = key; addHeat(18, "Проезд на красный", "перекрёсток " + key.replace(":", "×"));
    } else lastCross = key;
  }

  if(clock - lastViol > 3) heat = Math.max(0, heat - 5.5*dt);
  if(cops.length && heat <= 14){ clearCops(); toast("Оторвались", "патруль потерял такси из виду"); }

  if(!S.order) return;
  const o = S.order, tg = target();
  o.patience = Math.max(0, o.patience - dt);
  if(o.patience <= 0){
    if(o.phase === "pickup"){ failOrder(false); return; }
    o.late = (o.late || 0) + dt;
    if(o.late > 28){ failOrder(true); return; }
  }
  if(o.phase === "ride") o.ridden += Math.abs(car.sp)*dt;

  if(Math.hypot(car.x-tg.x, car.y-tg.y) < 32 && Math.abs(car.sp) < 26){
    if(o.phase === "pickup"){
      o.phase = "ride"; setPatience();
      taxi.userData.pax.userData.fur.color.set(o.fur);
      toast("Пассажир в салоне", `${o.who} · едем на ${o.to.street}`); paintOrder();
    } else finish();
  }
}
function hits(x,y){
  const w = 24, h = 13, c = Math.cos(car.a), s = Math.sin(car.a);
  for(const [ox,oy] of [[w/2,h/2],[w/2,-h/2],[-w/2,h/2],[-w/2,-h/2],[0,0]])
    if(solid(x + ox*c - oy*s, y + ox*s + oy*c)) return true;
  return false;
}

function finish(){
  const o = S.order, P = stats();
  const meters = Math.max(o.ridden, Math.hypot(o.from.x-o.to.x, o.from.y-o.to.y)*0.9) * M_PER_PX;
  const fare = Math.round((BOARD + meters*PER_M) * P.fare);
  const left = o.patience / o.patMax;
  const tip = Math.round(fare * 0.4 * left * P.tips);
  const total = fare + tip;

  const score = 5 - Math.min(2, o.crashes*0.6) - (left <= 0 ? 1.2 : 0);
  S.rating = Math.max(1, Math.min(5, S.rating*0.85 + score*0.15));
  S.money += total; S.orders++; S.shiftOrders++; S.shiftMoney += total;
  coins(); sfx("coin");
  toast(`+${total.toLocaleString("ru-RU")} ж`, `${Math.round(meters)} м · счётчик ${fare} ж · чаевые ${tip} ж`);
  save();

  if(S.orders % 10 === 0 && S.unlocked < CREW.length){
    S.unlocked++; S.order = null; paintHUD(); save(); sfx("level");
    setTimeout(()=> unlockSheet(CREW[S.unlocked-1]), 450);
    return;
  }
  newOrder(); paintHUD();
}

/* ---------- срыв заказа и конец смены ---------- */
function failOrder(mid){
  const o = S.order;
  S.fails++; S.shiftFails++;
  S.rating = Math.max(1, S.rating*0.78 + 0.8*0.22);
  if(mid){
    const paid = Math.round(BOARD * stats().fare);
    S.money += paid;
    toast(`${o.who} вышел на полпути`, `оплачена только посадка · ${paid} ж`);
  } else {
    toast(`${o.who} ушёл пешком`, `заказ сорван · рейтинг ${S.rating.toFixed(2)}`);
  }
  sfx("fail");
  S.order = null; save(); paintHUD(); paintOrder();
  if(ratingCheck()) return;
  newOrder();
}
function ratingCheck(){
  if(S.started && S.rating < 2){
    endShift("Диспетчер снял с линии", `Рейтинг упал до ${S.rating.toFixed(2)}. В парке такому за руль больше не дают — до завтра.`);
    return true;
  }
  return false;
}
function endShift(title, why){
  S.started = false; S.paused = true; S.order = null;
  heat = 0; clearCops(); car.sp = 0;
  const money = Math.round(S.shiftMoney), rec = money > S.record.money;
  if(rec) S.record = {money, orders:S.shiftOrders};
  save(); paintOrder(); paintHUD();
  const row = (k, v, hi)=> `<div class="tr${hi ? " hi" : ""}"><span>${k}</span><b>${v}</b></div>`;
  openSheet(`<h2>${title}</h2><div class="sub">${why}</div>
    <div class="tally">
      ${row("Заработано за смену", money.toLocaleString("ru-RU") + " ж", true)}
      ${row("Доставлено", S.shiftOrders + " заказов")}
      ${row("Сорвано", S.shiftFails)}
      ${row("Рейтинг", S.rating.toFixed(2))}
      ${row("В кассе всего", Math.round(S.money).toLocaleString("ru-RU") + " ж")}
      ${row(rec ? "★ новый рекорд смены" : "Рекорд смены",
            S.record.money.toLocaleString("ru-RU") + " ж · " + S.record.orders + " зак.", rec)}
    </div>
    <div class="foot"><span class="label">новая смена начинается с рейтинга не ниже 4,00</span>
    <button class="btn primary" data-newshift>Новая смена</button></div>`);
  sheet.querySelector("[data-newshift]").onclick = newShift;
}
function newShift(){
  S.shiftMoney = 0; S.shiftOrders = 0; S.shiftFails = 0;
  S.rating = Math.max(S.rating, 4);
  S.started = true; heat = 0; clearCops(); car.sp = 0;
  audioBoot(); closeSheet(); newOrder(); paintHUD(); save();
}

function garage(){
  const rows = UPGRADES.map(u=>{
    const l = S.up[u.id], c = cost(u,l), max = l >= MAXLVL;
    const pips = Array.from({length:MAXLVL}, (_,i)=>`<i class="${i<l?"on":""}"></i>`).join("");
    return `<div class="it">
      <div><div class="nm">${u.name}</div><div class="pips">${pips}</div></div>
      <button class="btn ${!max && S.money>=c ? "primary":""}" data-up="${u.id}" ${max||S.money<c?"disabled":""}>${max?"максимум":c+" ж"}</button>
      <div class="ef">${l ? u.ef(l) : "не улучшено"}${max ? "" : ` → ${u.ef(l+1)}`}</div>
    </div>`;
  }).join("");
  openSheet(`<h2>Гараж</h2><div class="sub">Улучшения общие для всего парка — их получает любой водитель, кто сядет за руль.</div>
    <div class="upg">${rows}</div>
    <div class="foot"><span class="label">в кассе ${Math.round(S.money).toLocaleString("ru-RU")} ж</span>
    <button class="btn primary" data-close>На линию</button></div>`);
  sheet.querySelectorAll("[data-up]").forEach(b=> b.onclick = ()=>{
    const u = UPGRADES.find(x=>x.id===b.dataset.up), l = S.up[u.id], c = cost(u,l);
    if(S.money >= c && l < MAXLVL){ S.money -= c; S.up[u.id]++; save(); paintHUD(); garage(); toast(`${u.name} · уровень ${S.up[u.id]}`); }
  });
  bindClose();
}
function crew(){
  const cards = CREW.map((a,i)=>{
    const open = i < S.unlocked, cur = i === S.driver;
    return `<div class="c ${cur?"on":""} ${open?"":"lock"}">${avatar(a, 56)}
      <div class="nm">${open ? a.name : "???"}</div>
      <div class="${open?"pk":"lk"}">${open ? a.perk : `откроется на ${a.at}-м заказе`}</div>
      ${open ? `<button class="btn" data-crew="${i}" ${cur?"disabled":""}>${cur?"за рулём":"за руль"}</button>` : ""}
    </div>`;
  }).join("");
  openSheet(`<h2>Парк водителей</h2><div class="sub">Каждые 10 заказов в парк приходит новое животное. Перк работает, пока оно за рулём.</div>
    <div class="crew">${cards}</div>
    <div class="foot"><span class="label">открыто ${S.unlocked} из ${CREW.length}</span><button class="btn primary" data-close>На линию</button></div>`);
  sheet.querySelectorAll("[data-crew]").forEach(b=> b.onclick = ()=>{ S.driver = +b.dataset.crew; save(); paintHUD(); crew(); });
  bindClose();
}
function unlockSheet(a){
  openSheet(`<div class="hero">${avatar(a,88)}<div><h2>${a.name} выходит на смену</h2>
    <div class="sub" style="margin-bottom:0">${a.kind[0].toUpperCase()+a.kind.slice(1)}. ${a.perk}</div></div></div>
    <div class="foot"><button class="btn" data-stay>Остаться за рулём</button><button class="btn primary" data-take>Передать руль</button></div>`);
  sheet.querySelector("[data-take]").onclick = ()=>{ S.driver = CREW.indexOf(a); save(); paintHUD(); closeSheet(); newOrder(); };
  sheet.querySelector("[data-stay]").onclick = ()=>{ closeSheet(); newOrder(); };
  paintHUD();
}
function pauseMenu(){
  openSheet(`<h2>Пауза</h2><div class="sub">Счётчик остановлен, пассажир не нервничает.</div>
    <div class="keys"><kbd>A</kbd> <kbd>D</kbd> или ← → — руль · <kbd>W</kbd> ↑ — газ · <kbd>S</kbd> ↓ — тормоз и задний ход<br>
    <kbd>C</kbd> или кнопка «Вид» — камера сзади → сверху → на водителя. <kbd>M</kbd> — звук. <kbd>Esc</kbd> — пауза.<br>
    Зелёный столб — посадка, красный — высадка. ДТП, красный свет и наезд на тротуаре вызывают патруль.<br>
    Терпение кончилось у стоящего пассажира — заказ сорван; рейтинг ниже 2,00 закрывает смену.</div>
    <div class="foot" style="flex-wrap:wrap">
      <button class="btn" data-reset>Сбросить всё</button>
      <button class="btn" data-hand>Сдать смену</button>
      <button class="btn primary" data-close>Продолжить</button></div>`);
  sheet.querySelector("[data-hand]").onclick = ()=>
    endShift("Смена сдана", `За смену ${S.shiftOrders} заказов. Выручка в кассе, гараж открыт.`);
  sheet.querySelector("[data-reset]").onclick = ()=>{
    if(!confirm("Сбросить заработок, прокачку и парк водителей?")) return;
    S.money=0; S.orders=0; S.rating=5; S.driver=0; S.unlocked=1; S.up={motor:0,boost:0,tyres:0,meterUp:0,charm:0};
    S.fails=0; S.record={money:0,orders:0}; S.shiftMoney=0; S.shiftOrders=0; S.shiftFails=0;
    heat=0; clearCops();
    save(); paintHUD(); newOrder(); closeSheet();
  };
  bindClose();
}
el("btnGarage").onclick = ()=>{ if(S.started) garage(); };
el("btnCrew").onclick = ()=>{ if(S.started) crew(); };
el("btnView").onclick = nextView;
el("btnSound").onclick = toggleSound;
el("btnSound").textContent = S.muted ? "Тихо" : "Звук";

function startSheet(){
  const a = CREW[S.driver];
  openSheet(`<div class="hero">${avatar(a,88)}<div>
    <h2>Хвостоград Такси 3D</h2>
    <div class="sub" style="margin-bottom:0">Полдень в зверином квартале, камера за кормой. За рулём ${a.name}, ${a.kind}: подбираете пассажира у зелёного столба и везёте к красному. Счётчик тикает, чаевые тают вместе с терпением.</div></div></div>
    <div class="keys"><kbd>A</kbd> <kbd>D</kbd> или ← → — руль · <kbd>W</kbd> ↑ — газ · <kbd>S</kbd> ↓ — тормоз и задний ход · <kbd>C</kbd> — камера · <kbd>M</kbd> — звук<br>
    По улицам идёт встречный поток, ходят пешеходы и работают светофоры. ДТП, красный свет и наезд на тротуаре поднимают розыск — патруль догонит и выпишет штраф.<br>
    Пассажир ждёт не вечно: терпение кончилось — заказ сорван и рейтинг падает. Ниже 2,00 диспетчер снимает с линии.<br>
    Каждые 10 заказов в парк приходит новое животное со своим перком. Выручка тратится в гараже. За смену город успевает прожить сутки.</div>
    <div class="foot"><span class="label">${S.record.money ? `рекорд смены ${S.record.money.toLocaleString("ru-RU")} ж · ${S.record.orders} зак.` : (S.orders ? `в кассе ${Math.round(S.money).toLocaleString("ru-RU")} ж` : "смена первая")}</span>
    <button class="btn primary" data-go>${S.orders ? "Продолжить смену" : "Выйти на линию"}</button></div>`);
  sheet.querySelector("[data-go]").onclick = ()=>{
    audioBoot();
    S.started = true; veil.hidden = true; S.paused = false;
    S.shiftMoney = 0; S.shiftOrders = 0; S.shiftFails = 0;
    newOrder(); paintHUD();
  };
}

/* ---------- цикл ---------- */
let last = performance.now();
function loop(t){
  const dt = Math.min(0.045, (t - last)/1000); last = t;
  if(!S.paused && S.started) update(dt);
  else clock += dt;                                  // светофоры и мигалки живут и на паузе
  syncScene(dt); drawMini(); paintLive(); audioFrame();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
resize();
for(let i=0;i<MAX_TRAFFIC;i++) spawnTraffic();
updatePeds(0);
paintHUD(); paintOrder(); startSheet();
requestAnimationFrame(loop);
</script>

</body></html>
